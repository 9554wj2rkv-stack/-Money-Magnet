/* ================= MONEY MESSAGES: status system (built-ins keep stable text-hash IDs) ================= */
const msgIdFor = t => 'msg-'+hash(String(t).trim()).toString(36);
let _BUILTIN_MSGS=null;
const builtinMsgs = () => _BUILTIN_MSGS||(_BUILTIN_MSGS=MESSAGES.map(t=>({id:msgIdFor(t),text:t,source:'built-in'})));
/* every message with its live status: built-ins (status from messageStatus overrides) + user messages */
function allMessages(S){
  const ms=S.messageStatus||{};
  const b=builtinMsgs().map(m=>({...m,status:(ms[m.id]&&ms[m.id].status)||'active',replacedBy:ms[m.id]&&ms[m.id].replacedBy||null}));
  return [...b,...(S.userMessages||[])];
}
const activeMessages = S => allMessages(S).filter(m=>m.status==='active');
const findMessage = (S,id) => allMessages(S).find(m=>m.id===id)||null;
const findMessageByText = (S,t) => { const n=String(t||'').trim().toLowerCase(); return allMessages(S).find(m=>m.text.trim().toLowerCase()===n)||null; };
/* pure state updaters */
function setMsgStatus(s,id,status,extra={}){
  if(String(id).startsWith('msg-')){ const ms={...(s.messageStatus||{})}; if(status==='active') delete ms[id]; else ms[id]={status,at:dayKey(),...extra}; return {...s,messageStatus:ms}; }
  return {...s,userMessages:(s.userMessages||[]).map(m=>m.id===id?{...m,status,...extra}:m)};
}
function newUserMessage(text,source,extra={}){ return {id:'umsg-'+uid(),text:text.trim(),status:'active',source,createdAt:dayKey(),replacedBy:null,replacedFrom:null,history:[],...extra}; }
/* make sure a glitch's original statement has a message record we can mark (typed statements get one, kept out of rotation) */
function ensureOriginal(s,g){
  const id=g.msgId&&findMessage(s,g.msgId)?g.msgId:(findMessageByText(s,g.statement)||{}).id;
  if(id) return [s,id];
  const m=newUserMessage(g.statement,'glitch-statement',{status:'inactive'});
  return [{...s,userMessages:[...(s.userMessages||[]),m]},m.id];
}
function migrateMessages(s){
  const out={...s,messageStatus:s.messageStatus||{},userMessages:s.userMessages||[]};
  out.glitches=(s.glitches||[]).map(g=>{ if(g.msgMigrated) return g; const m=findMessageByText(out,g.statement); return {...g,msgId:g.msgId||(m?m.id:null),originalStatus:g.originalStatus||'active',msgMigrated:true}; });
  return out;
}
const SOURCE_LABEL={'built-in':'BUILT-IN','user-created':'MINE','bridge-replacement':'FROM A GLITCH','glitch-statement':'FROM A GLITCH'};

function GlitchActions({g}){
  const {S,patch,toast,open}=useFX();
  const [modal,setModal]=useState(null); const [alsoRetire,setAlsoRetire]=useState(false);
  const replacement=g.replacementMsgId?findMessage(S,g.replacementMsgId):null;
  const replace=()=>{ patch(s=>{ let [ns,origId]=ensureOriginal(s,g); const nm=newUserMessage(g.bridge,'bridge-replacement',{replacedFrom:origId,glitchId:g.id});
      ns={...ns,userMessages:[...ns.userMessages,nm]}; ns=setMsgStatus(ns,origId,'replaced',{replacedBy:nm.id});
      return {...ns,glitches:ns.glitches.map(x=>x.id===g.id?{...x,msgId:origId,originalStatus:'replaced',replacementMsgId:nm.id}:x)}; });
    setModal(null); ding(900,.2); toast('Your new message is in the deck ✨'); };
  const retire=()=>{ patch(s=>{ let [ns,origId]=ensureOriginal(s,g); ns=setMsgStatus(ns,origId,'retired');
      return {...ns,glitches:ns.glitches.map(x=>x.id===g.id?{...x,msgId:origId,originalStatus:'retired'}:x)}; });
    setModal(null); toast('Retired — it won\u2019t appear in your deck 🗄️'); };
  const restore=()=>{ patch(s=>{ let [ns,origId]=ensureOriginal(s,g); const m=findMessage(ns,origId); ns=setMsgStatus(ns,origId,m&&m.source==='glitch-statement'?'inactive':'active',{replacedBy:null});
      return {...ns,glitches:ns.glitches.map(x=>x.id===g.id?{...x,originalStatus:'active'}:x)}; }); toast('Original message restored'); };
  const del=()=>{ patch(s=>{ let ns=s; if(alsoRetire&&g.originalStatus==='active'){ const r=ensureOriginal(ns,g); ns=setMsgStatus(r[0],r[1],'retired'); }
      return {...ns,glitches:ns.glitches.filter(x=>x.id!==g.id)}; }); setModal(null); toast('Glitch record deleted'); };
  const st=g.originalStatus||'active';
  return html`<div>
    ${st!=='active' && html`<div className="msg-evo">
      <div className="kv"><span>Original message</span><b className="struck">“${g.statement}”</b></div>
      <span className=${'status-badge '+st}>${st==='replaced'?'REPLACED':'RETIRED'}</span>
      ${st==='replaced' && replacement && html`<div className="kv"><span>My new message</span><b>“${replacement.text}”</b></div>`}
    </div>`}
    <div className="glitch-btns">
      <button className="btn tiny ghost" onClick=${()=>open('glitch',false,{glitchId:g.id})}>${g.bridge?'CHANGE BRIDGE':'BUILD A BRIDGE'} 🌉</button>
      ${st==='active' && html`<button className="btn tiny ghost" disabled=${!g.bridge} title=${g.bridge?'':'Build a bridge first'} onClick=${()=>setModal('replace')}>✏️ REPLACE ORIGINAL</button>`}
      ${st==='active' && html`<button className="btn tiny ghost" onClick=${()=>setModal('retire')}>🗄️ RETIRE ORIGINAL</button>`}
      ${st==='retired' && html`<button className="btn tiny ghost" onClick=${restore}>↩︎ RESTORE ORIGINAL</button>`}
    </div>
    ${modal==='replace' && html`<${Modal} onClose=${()=>setModal(null)} label="Replace this money message">
      <h3>Replace this Money Message?</h3>
      <div className="kv"><span>Old</span><b className="struck">“${g.statement}”</b></div>
      <div className="kv" style=${{marginTop:12}}><span>New</span><b>“${g.bridge}”</b></div>
      <p style=${{fontWeight:700}}>The new sentence will replace the old one in your Money Message Deck. Your Glitch history stays in the Vault.</p>
      <div className="stack"><button className="btn pink" onClick=${replace}>✨ YES — USE MY NEW MESSAGE</button><button className="btn ghost" onClick=${()=>setModal(null)}>CANCEL</button></div>
    <//>`}
    ${modal==='retire' && html`<${Modal} onClose=${()=>setModal(null)} label="Retire this message">
      <h3>Stop showing this message?</h3>
      <div className="kv"><span>Message</span><b>“${g.statement}”</b></div>
      <p style=${{fontWeight:700}}>This message will be removed from your Money Message Deck, but its Glitch history will remain in your Vault. You can restore it any time.</p>
      <div className="stack"><button className="btn" onClick=${retire}>YES — RETIRE IT</button><button className="btn ghost" onClick=${()=>setModal(null)}>CANCEL</button></div>
    <//>`}
    ${modal==='delete' && html`<${Modal} onClose=${()=>setModal(null)} label="Delete glitch record">
      <h3>Delete this Glitch record?</h3>
      <p style=${{fontWeight:700}}>This deletes the Glitch history, your bridge and its progress.</p>
      ${st==='active' && html`<label className="check-line"><input type="checkbox" checked=${alsoRetire} onChange=${e=>setAlsoRetire(e.target.checked)}/><span>Also stop showing the original Money Message</span></label>`}
      ${st==='replaced' && html`<p className="muted small" style=${{fontWeight:700}}>Your new message stays in your deck.</p>`}
      <div className="stack"><button className="btn danger" onClick=${del}>DELETE GLITCH</button><button className="btn ghost" onClick=${()=>setModal(null)}>CANCEL</button></div>
    <//>`}
    <button className="glitch-x" aria-label="Delete glitch record" onClick=${()=>{ setAlsoRetire(false); setModal('delete'); }}>✕</button>
  </div>`;
}

function MyMessages(){
  const {S,patch,toast}=useFX();
  const [tab,setTab]=useState('active'); const [limit,setLimit]=useState(30); const [q,setQ]=useState('');
  const [editing,setEditing]=useState(null); const [text,setText]=useState(''); const [confirm,setConfirm]=useState(null);
  const all=allMessages(S);
  const active=all.filter(m=>m.status==='active'); const mine=(S.userMessages||[]).filter(m=>m.source!=='glitch-statement'||m.status==='active');
  const retired=all.filter(m=>m.status==='retired'||m.status==='replaced');
  const openEdit=m=>{ setEditing(m||{}); setText(m&&m.text||''); };
  const save=()=>{ const t=text.trim(); if(!t) return;
    if(!editing.id){ patch(s=>({...s,userMessages:[...(s.userMessages||[]),newUserMessage(t,'user-created')]})); toast('Added to your deck ✨'); }
    else if(editing.source==='built-in'){ patch(s=>{ const nm=newUserMessage(t,'user-created',{replacedFrom:editing.id}); let ns={...s,userMessages:[...(s.userMessages||[]),nm]}; return setMsgStatus(ns,editing.id,'replaced',{replacedBy:nm.id}); }); toast('Your wording replaces the original ✨'); }
    else { patch(s=>({...s,userMessages:s.userMessages.map(m=>m.id===editing.id?{...m,text:t,history:[...(m.history||[]),m.text].slice(-10),editedAt:dayKey()}:m)})); toast('Updated ✨'); }
    setEditing(null); };
  const retire=m=>{ patch(s=>{ let ns=setMsgStatus(s,m.id,'retired'); return {...ns,glitches:ns.glitches.map(g=>g.msgId===m.id&&g.originalStatus==='active'?{...g,originalStatus:'retired'}:g)}; }); toast('Retired 🗄️'); };
  const restore=m=>{ patch(s=>{ let ns=setMsgStatus(s,m.id,'active',{replacedBy:null}); return {...ns,glitches:ns.glitches.map(g=>g.msgId===m.id&&g.originalStatus!=='active'?{...g,originalStatus:'active'}:g)}; }); toast('Back in your deck ✨'); };
  const del=m=>{ patch(s=>({...s,userMessages:s.userMessages.filter(x=>x.id!==m.id)})); setConfirm(null); toast('Message deleted'); };
  const replacedByText=m=>{ const r=m.replacedBy&&findMessage(S,m.replacedBy); return r?r.text:null; };
  const list=(tab==='active'?active:tab==='mine'?mine:retired).filter(m=>!q.trim()||m.text.toLowerCase().includes(q.trim().toLowerCase()));
  const Row=m=>html`<div key=${m.id} className="msg-row">
    <div style=${{flex:1,minWidth:0}}><b>${m.text}</b>
      <div className="msg-meta"><span className=${'src-badge '+(m.source||'')}>${SOURCE_LABEL[m.source]||'MINE'}</span>${m.status!=='active'?html`<span className=${'status-badge '+m.status}>${m.status==='replaced'?'REPLACED':m.status==='retired'?'RETIRED':'NOT IN DECK'}</span>`:''}</div>
      ${m.status==='replaced'&&replacedByText(m) && html`<div className="muted small" style=${{fontWeight:700,marginTop:4}}>→ “${replacedByText(m)}”</div>`}</div>
    <span className="mine-act">
      ${m.status==='active' && html`<button className="x" aria-label="Edit" onClick=${()=>openEdit(m)}>✎</button><button className="x" aria-label="Retire" onClick=${()=>retire(m)}>🗄️</button>`}
      ${(m.status==='retired'||m.status==='replaced') && html`<button className="btn tiny ghost" onClick=${()=>restore(m)}>RESTORE</button>`}
      ${m.source!=='built-in' && tab==='mine' && html`<button className="x" aria-label="Delete" onClick=${()=>setConfirm(m)}>✕</button>`}
    </span></div>`;
  return html`<div>
    <h1 className="game-title display">✨ MY MONEY MESSAGES</h1>
    <p className="game-sub">My wording overrides the app\u2019s wording.</p>
    <div className="ev-total"><div className="stat"><div className="sv">${active.length}</div><div className="sl">IN MY DECK</div></div><div className="stat"><div className="sv">${(S.userMessages||[]).filter(m=>m.status==='active').length}</div><div className="sl">MY OWN WORDING</div></div></div>
    <button className="btn sea" style=${{marginTop:14}} onClick=${()=>openEdit(null)}>+ ADD MY OWN MONEY MESSAGE</button>
    <div className="seg" style=${{marginTop:14}}>${[['active','ACTIVE'],['mine','MY OWN'],['retired','RETIRED']].map(([k,l])=>html`<button key=${k} className=${tab===k?'on':''} onClick=${()=>{ setTab(k); setLimit(30); }}>${l} · ${(k==='active'?active:k==='mine'?mine:retired).length}</button>`)}</div>
    <input className="input" type="search" style=${{marginTop:12}} placeholder="Search messages…" value=${q} onChange=${e=>setQ(e.target.value)}/>
    <div className="card" style=${{paddingTop:4,paddingBottom:4}}>
      ${list.length===0 && html`<p style=${{fontWeight:700}}>${tab==='mine'?'Messages you write — or replace through a Glitch — live here.':tab==='retired'?'Nothing retired. Anything you retire or replace can be restored here.':'No messages match.'}</p>`}
      ${list.slice(0,limit).map(Row)}
    </div>
    ${list.length>limit && html`<button className="btn ghost" style=${{marginTop:10}} onClick=${()=>setLimit(l=>l+30)}>SHOW MORE (${list.length-limit})</button>`}
    ${editing && html`<${Modal} onClose=${()=>setEditing(null)} label="Money message">
      <h3>${!editing.id?'My own Money Message':editing.source==='built-in'?'Say it my way':'Edit my message'}</h3>
      ${editing.source==='built-in' && html`<p className="muted small" style=${{fontWeight:700}}>Your wording will replace the original in your deck. You can restore the original later.</p>`}
      <textarea className="input" aria-label="Message" placeholder="Money is safe for me to receive ❤️" value=${text} onChange=${e=>setText(e.target.value)}></textarea>
      <div className="btn-row"><button className="btn ghost" onClick=${()=>setEditing(null)}>CANCEL</button><button className="btn" disabled=${!text.trim()||text.trim()===editing.text} onClick=${save}>SAVE</button></div>
    <//>`}
    ${confirm && html`<${Modal} onClose=${()=>setConfirm(null)} label="Delete message"><h3>Delete this message?</h3><p style=${{fontWeight:700}}>“${confirm.text}” will be removed completely. To just stop seeing it, retire it instead.</p>
      <div className="stack"><button className="btn danger" onClick=${()=>del(confirm)}>DELETE MESSAGE</button><button className="btn ghost" onClick=${()=>retire(confirm)||setConfirm(null)}>RETIRE INSTEAD</button><button className="btn ghost" onClick=${()=>setConfirm(null)}>CANCEL</button></div><//>`}
  </div>`;
}

    <button className="btn ghost" style=${{marginTop:16}} onClick=${()=>open('mymessages')}>✨ MY MONEY MESSAGES</button>
    <p className="disclaimer">A self-reflection tool, not a psychological measurement.</p>
  </div>`;

  const [name,setName]=useState(init.name||''); const [emoji,setEmoji]=useState(init.emoji||'✨'); const [target,setTarget]=useState(init.target?fmt(init.target):'');

/* ================= PAYDAY POWER ================= */
function Payday(){

  const [step,setStep]=useState('feel'); const [feel,setFeel]=useState(null); const [reveal,setReveal]=useState(0);
  const [amount,setAmount]=useState(''); const total=parseNum(amount);
  const [alloc,setAlloc]=useState({}); const [size,setSize]=useState(500); const [fb,setFb]=useState(null); const [edit,setEdit]=useState(false); const [result,setResult]=useState(null);
  useEffect(()=>{ if(step!=='message') return; if(REDUCED){ setReveal(4); return; } if(reveal>=4) return;
    const t=setTimeout(()=>setReveal(r=>r+1),reveal===0?250:1300); return ()=>clearTimeout(t); },[step,reveal]);
  const buckets=[{key:'now',e:'✨',n:'NOW ME',sub:'Fun · spending · treats'},
    ...S.goals.map(g=>({key:g.id,e:g.emoji,n:g.name,sub:g.target?`${fmt(g.real||0)} / ${fmt(g.target)} saved`:`${fmt(g.real||0)} saved`,future:true})),
    ...GOAL_PRESETS.filter(p=>!S.goals.some(g=>g.name===p.n)).map(p=>({key:'preset:'+p.key,e:p.e,n:p.n,sub:'New goal',future:true,preset:p}))];
  const used=Object.values(alloc).reduce((a,b)=>a+b,0); const remaining=total-used;
  const futureTotal=buckets.filter(b=>b.future).reduce((a,b)=>a+(alloc[b.key]||0),0);
  const give=(b,dir)=>{ const cur=alloc[b.key]||0;
    const delta=dir>0?(size==='all'?remaining:Math.min(size,remaining)):-(size==='all'?cur:Math.min(size,cur));
    if(!delta) return; setAlloc({...alloc,[b.key]:cur+delta});
    if(dir>0){ setFb({id:uid(),key:b.key,title:`+${fmt(delta)} KR TO ${b.n} ✨`,line:b.future?pick(PAY_LINES(delta)):'Enjoy it — on purpose.'}); ding(b.future?900:700,.1); } };
  const finish=real=>{ const snap={...alloc};
    const lines=buckets.filter(b=>snap[b.key]>0).map(b=>({e:b.e,n:b.n,v:snap[b.key],future:!!b.future}));
    record('payday',30,s=>{ let ns={...s}; const ids={};
      GOAL_PRESETS.forEach(p=>{ const k='preset:'+p.key; if(snap[k]>0){ const g={id:'goal'+uid(),name:p.n,emoji:p.e,target:0,real:0,practice:0,created:dayKey()}; ns={...ns,goals:[...ns.goals,g]}; ids[k]=g.id; } });
      Object.entries(snap).forEach(([k,v])=>{ if(k==='now'||!v) return; ns=applyDeposit(ns,ids[k]||k,v,real,'payday'); });
      ns=addMoment(ns,'payday'); return {...ns,paydays:[...ns.paydays,{date:dayKey(),amount:total,feeling:feel,alloc:snap,real:!!real}]}; });
    if(real&&futureTotal) record('saveReal',30);
    confetti(); setResult({lines,real,futureTotal,now:snap.now||0,left:remaining}); setStep('done'); };

  if(step==='feel') return html`<div>
    <h1 className="game-title display">💰 PAYDAY POWER</h1>
    <p className="game-sub">Your money arrived. Decide what it does before impulse decides for you.</p>
    <h2 className="h2 center" style=${{marginTop:12}}>HOW DOES PAYDAY FEEL?</h2>
    <div className="opt-grid">${PAY_FEELS.map(f=>html`<button key=${f} className=${feel===f?'on':''} onClick=${()=>{ setFeel(f); setReveal(0); setStep('message'); }}>${f}</button>`)}</div>
  </div>`;

  if(step==='message'){ const L=[['YOU WORKED FOR THIS MONEY.','pm-1'],['You deserve to enjoy some of it.','pm-2'],['And you deserve to keep some of it.','pm-2'],['KEEP FIRST. PLAY SECOND.','pm-3']];
    return html`<div className="center pay-msg">
      ${L.slice(0,reveal).map(([t,c])=>html`<p key=${t} className=${'display '+c}>${t}</p>`)}
      ${reveal>=4 && html`<button className="btn" style=${{marginTop:20}} onClick=${()=>setStep('amount')}>LET\u2019S DECIDE →</button>`}
    </div>`; }

  if(step==='amount') return html`<div>
    <h1 className="game-title display">How much arrived?</h1>
    <label className="lbl" htmlFor="pa">PAYDAY AMOUNT (DKK)</label>
    <input id="pa" className="input big-input" inputMode="numeric" placeholder="25,000" value=${amount} onChange=${e=>{ const v=parseNum(e.target.value); setAmount(v?fmt(v):''); setAlloc({}); }}/>
    <div style=${{marginTop:16}}><button className="btn" disabled=${!total} onClick=${()=>setStep('alloc')}>GIVE MY MONEY JOBS</button></div>
    <p className="disclaimer">No rules, no percentages. You decide.</p>
  </div>`;

  if(step==='alloc'){ const segs=buckets.filter(b=>alloc[b.key]>0);

    <div className="balance remaining">
      <div className="row-between"><span className="bl">PAYDAY · ${fmt(total)} DKK</span><span className="bl">${segs.length} ${segs.length===1?'job':'jobs'}</span></div>
      <div className="bv">${fmt(remaining)} DKK</div><div className="bl" style=${{marginTop:2}}>STILL UNASSIGNED</div>
      <div className="seg-bar">${segs.map((b,i)=>html`<i key=${b.key} title=${b.n} style=${{width:(alloc[b.key]/total*100)+'%',background:SEG_COLORS[buckets.indexOf(b)%SEG_COLORS.length]}}></i>`)}</div>
    </div>
    ${fb && html`<div className="pay-fb" key=${fb.id}><b>${fb.title}</b><span>${fb.line}</span></div>`}
    <div className="seg" style=${{marginTop:12}} aria-label="Amount per tap">${[100,500,1000,5000,'all'].map(v=>html`<button key=${v} className=${size===v?'on':''} onClick=${()=>setSize(v)}>${v==='all'?'ALL REST':fmt(v)}</button>`)}</div>
    <div className="buckets">${buckets.map((b,i)=>{ const v=alloc[b.key]||0; return html`<div key=${b.key} className=${'bucket'+(v?' has':'')+(b.key==='now'?' now':'')}>
      <span className="bk-e" style=${{background:SEG_COLORS[i%SEG_COLORS.length]}}>${b.e}</span>
      <span className="bk-t"><b>${b.n}</b><span>${v?fmt(v)+' DKK':b.sub}</span></span>
      <button className="bk-btn minus" aria-label=${'Less to '+b.n} disabled=${!v} onClick=${()=>give(b,-1)}>−</button>
      <button className="bk-btn" aria-label=${'More to '+b.n} disabled=${!remaining} onClick=${()=>give(b,1)}>+</button>
    </div>`; })}</div>
    <button className="btn ghost" style=${{marginTop:12}} onClick=${()=>setEdit(true)}>+ CUSTOM GOAL</button>
    <div style=${{marginTop:12}}><button className="btn pink" disabled=${!used} onClick=${()=>futureTotal?setStep('real'):finish(false)}>I DECIDED ✨</button></div>
    ${remaining>0&&used>0 && html`<p className="disclaimer">${fmt(remaining)} DKK unassigned — it simply stays put. That\u2019s allowed.</p>`}
    ${edit && html`<${GoalEditor} init=${{name:'',emoji:'✨'}} onClose=${()=>setEdit(false)} onSaved=${()=>setEdit(false)}/>`}
  </div>`; }

  if(step==='real') return html`<div className="center">
    <h1 className="game-title display">${fmt(futureTotal)} kr for Future Me</h1>
    <p className="display q-big">Did you actually move this money?</p>
    <div className="stack"><button className="btn sea" onClick=${()=>finish(true)}>YES — I MOVED IT</button><button className="btn ghost" onClick=${()=>finish(false)}>NO — JUST PRACTICING</button></div>

  </div>`;

  return html`<div className="center">
    <div className="glitch-badge">KEEP FIRST. PLAY SECOND. ✓</div>

    <button className="btn" onClick=${close}>DONE</button>
  </div>`;
}

/* ================= LET IT STAY ================= */
function LetItStay(){
  const {S,record}=useFX();
  const [total,setTotal]=useState(()=>pick(STAY_AMTS)); const [step,setStep]=useState('arrive'); const [keep,setKeep]=useState(50); const [phase,setPhase]=useState(0);
  const kept=Math.round(total*keep/100); const enjoyed=total-kept;
  const choose=k=>{ setKeep(k==='spend'?0:k==='keep'?100:50); setStep('divide'); };
  const confirm=()=>{ record('stay',25,s=>({...(kept>0?addMoment(s,'kept'):s),stays:[...s.stays,{date:dayKey(),total,kept}]})); setPhase(0); setStep('vault'); ding(760,.25); };
  useEffect(()=>{ if(step!=='vault') return; const d=REDUCED?[0,0,0]:[3200,5200,6800]; const ts=d.map((ms,i)=>setTimeout(()=>setPhase(i+1),ms)); return ()=>ts.forEach(clearTimeout); },[step]);
  const again=()=>{ setTotal(pick(STAY_AMTS)); setKeep(50); setStep('arrive'); };
  const coins=Math.round(keep/100*14);
  return html`<div>
    <div className="center"><span className="practice-chip">PRACTICE MONEY</span></div>
    ${step==='arrive' && html`<div className="center">
      <div className="big-number">${fmt(total)} DKK</div><h1 className="game-title display" style=${{marginTop:0}}>ARRIVED</h1>
      <p className="game-sub">What happens next?</p>
      <div className="stack">
        <button className="btn ghost" onClick=${()=>choose('spend')}>SPEND EVERYTHING</button>
        <button className="btn ghost" onClick=${()=>choose('keep')}>KEEP EVERYTHING</button>
        <button className="btn pink" onClick=${()=>choose('both')}>ENJOY SOME + KEEP SOME</button>
        <button className="btn ghost" onClick=${()=>choose('decide')}>LET ME DECIDE</button>
      </div></div>`}
    ${step==='divide' && html`<div>
      <h1 className="game-title display">Divide it your way</h1>
      <div className="ev-total"><div className="stat"><div className="sv">${fmt(enjoyed)}</div><div className="sl">✨ TO ENJOY</div></div><div className="stat"><div className="sv">${fmt(kept)}</div><div className="sl">💎 TO KEEP</div></div></div>
      <label className="lbl" htmlFor="ks">SLIDE TO DIVIDE</label>
      <input id="ks" type="range" min="0" max="100" step="5" value=${keep} onChange=${e=>setKeep(Number(e.target.value))} style=${{width:'100%',accentColor:'#d99a2b',height:40}}/>
      <div className="row-between muted small" style=${{fontWeight:800}}><span>Enjoy it all</span><span>Keep it all</span></div>
      <div style=${{marginTop:16}}><button className="btn" onClick=${confirm}>LET IT STAY 💎</button></div>
    </div>`}
    ${step==='vault' && html`<div className="center">
      <div className="vault" aria-label=${fmt(kept)+' DKK in the vault'}>
        <div className="vault-door"></div>
        <div className="vault-coins">${Array.from({length:coins},(_,i)=>html`<i key=${i} style=${{animationDelay:(i*.07)+'s'}}></i>`)}</div>
      </div>
      <div className="big-number">${fmt(kept)} DKK</div><h2 className="h2">STILL HERE</h2>
      ${enjoyed>0 && html`<p className="muted" style=${{fontWeight:800}}>${fmt(enjoyed)} DKK enjoyed ✨</p>`}
      ${kept===0 ? html`<p className="display stay-line show">That\u2019s okay. Noticing is the practice. Maybe let a little stay next time?</p>`
        : html`<p className=${'display stay-line'+(phase>=1?' show':'')}>You don\u2019t have to do anything with it.</p><p className=${'display stay-line'+(phase>=2?' show':'')}>Money is allowed to stay.</p>`}
      ${(phase>=3||kept===0) && html`<div className="stack" style=${{marginTop:12}}><button className="btn" onClick=${again}>RECEIVE AGAIN</button></div>`}
      <p className="disclaimer">Practice money only — never counted as real savings. ${S.stays.length} rounds played.</p>
    </div>`}
  </div>`;
}

const EMOJI_RE=/\p{Extended_Pictographic}(?:\uFE0F|\u200D\p{Extended_Pictographic})*\uFE0F?/u;

const splitEmoji=t=>{ const m=String(t||'').match(EMOJI_RE); return {emoji:m?m[0]:'',text:String(t||'').replace(EMOJI_RE_G,'').replace(/\s+/g,' ').trim()}; };

function weightedPick(items,n,wfn){ const pool=items.map(it=>({it,w:Math.max(.05,wfn(it))})); const out=[];
  while(out.length<n&&pool.length){ const tot=pool.reduce((a,b)=>a+b.w,0); let r=Math.random()*tot; let k=0; for(;k<pool.length;k++){ r-=pool[k].w; if(r<=0) break; } out.push(pool.splice(Math.min(k,pool.length-1),1)[0].it); }

function gratRecommend(S,G,exclude,mode){

  const fresh=it=>!shownToday.has(it.id);

  const recentPool=personal.filter(i=>!taken.has(i.id)&&fresh(i)).sort((a,b)=>(b.custom.createdAt||'').localeCompare(a.custom.createdAt||'')).slice(0,8);
  const recent=take(weightedPick(recentPool,nRecent,it=>score(it)+3));

  if(all.length<G){ const fill=weightedPick(lib.filter(i=>!taken.has(i.id)),G-all.length,()=>1); all=all.concat(fill); }
  return all.slice(0,G);
}

function GratExplore({arg}){
  const {S,record}=useFX();
  const [q,setQ]=useState(''); const [cat,setCat]=useState(arg&&arg.cat||null); const [limit,setLimit]=useState(40);
  const L=gratLib();
  const openCat=id=>{ setCat(id); setLimit(40); window.scrollTo&&window.scrollTo(0,0);
    if(!S.gratitudeCategoriesExplored.includes(id)) record('gratExplore',10,s=>({...s,gratitudeCategoriesExplored:[...s.gratitudeCategoriesExplored,id]})); };
  const results=useMemo(()=>{ const t=q.trim().toLowerCase(); if(!t) return null;
    const score=new Map(); const bump=(i,v)=>score.set(i,Math.max(score.get(i)||0,v));
    const esc=t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); const word=new RegExp('\\b'+esc+'(s|es)?\\b');
    L.all.forEach(i=>{ if(word.test(i.lc)) bump(i,3); else if(i.lc.includes(t)) bump(i,1); });
    if(t.length>=3) GRAT_CATS.forEach(c=>{ if(c.n.toLowerCase().includes(t)||c.kw.split(' ').some(k=>k===t||(k.length>=4&&(k.startsWith(t)||t.startsWith(k))))) c.list.forEach(i=>bump(i,2)); });
    return [...score.entries()].sort((a,b)=>b[1]-a[1]).map(e=>e[0]); },[q]);
  const customHits=q.trim()?S.customGratitudes.filter(c=>c.text.toLowerCase().includes(q.trim().toLowerCase())):[];
  const list=results||(cat?L.cat[cat].list:null);
  const C=cat&&L.cat[cat];
  return html`<div className="grat-scope">
    <label className="lbl" htmlFor="gq" style=${{marginTop:4}}>🔎 WHAT ARE YOU GRATEFUL FOR?</label>
    <input id="gq" className="input" type="search" placeholder="coffee, home, love, money…" value=${q} onChange=${e=>{ setQ(e.target.value); setLimit(40); }}/>
    ${!results && !cat && html`<div>
      <p className="muted small" style=${{fontWeight:800,margin:'14px 2px 0'}}>${L.all.length.toLocaleString('en-US')} things across ${GRAT_CATS.length} categories. Skip anything that doesn\u2019t apply — unchecked never means missing.</p>
      <div className="grat-cats">${GRAT_CATS.map(c=>{ const done=c.list.filter(i=>S.checkedGratitudeIds[i.id]).length; return html`<button key=${c.id} className="grat-cat" onClick=${()=>openCat(c.id)}>
        <span className="gce">${c.e}</span><b>${c.n}</b><span>${done?`❤️ ${done}`:'explore'}${S.gratitudeCategoriesExplored.includes(c.id)?'':' · new'}</span></button>`; })}</div>
    </div>`}
    ${cat && !results && html`<div className="row-between" style=${{marginTop:14}}><button className="btn tiny ghost" onClick=${()=>setCat(null)}>‹ ALL CATEGORIES</button><span className="pill">${C.list.filter(i=>S.checkedGratitudeIds[i.id]).length} ❤️</span></div>
      <h2 className="display" style=${{fontSize:'1.6rem',margin:'12px 0 4px'}}>${C.e} ${C.n}</h2>
      ${cat==='moneydoes' && html`<div className="grat-banner">MONEY ISN\u2019T ONLY SOMETHING I WANT MORE OF.<br/>MONEY IS ALREADY WORKING IN MY LIFE.</div>`}
      ${cat==='future' && html`<p className="muted small" style=${{fontWeight:700}}>Gratitude for possibility — not promises.</p>`}`}
    ${results && html`<p className="muted small" style=${{fontWeight:800,margin:'12px 2px 0'}}>${results.length+customHits.length} ${results.length+customHits.length===1?'result':'results'}</p>`}
    ${customHits.map(c=>html`<div key=${c.id} className="grat-row on"><div className="grat-check"><span className="gbox">✓</span><span className="gtext">${c.text} <span className="muted small">· my own</span></span></div></div>`)}
    ${list && html`<div className="grat-list">${list.slice(0,limit).map(i=>html`<${GratRow} key=${i.id} item=${i}/>`)}</div>`}
    ${list && list.length>limit && html`<button className="btn ghost" style=${{marginTop:12}} onClick=${()=>setLimit(l=>l+40)}>SHOW MORE (${list.length-limit})</button>`}
    ${results && results.length===0 && customHits.length===0 && html`<div className="card center"><p style=${{fontWeight:800,margin:0}}>Nothing matched — maybe it\u2019s one of your own?</p></div>`}
  </div>`;
}

/* ================= DAILY GRATITUDE (goal-driven: see DAILY_GRATITUDE_GOAL near the top) ================= */
const NUM_WORDS = {1:'one',2:'two',3:'three',4:'four',5:'five',6:'six',7:'seven',8:'eight',9:'nine',10:'ten',12:'twelve',15:'fifteen',20:'twenty'};
const goalWord = n => NUM_WORDS[n] || String(n);
const dayLabel = k => { const t=dayKey(); if(k===t) return 'TODAY'; if(k===addDays(t,-1)) return 'YESTERDAY';
  const [y,m,d]=k.split('-').map(Number); const dt=new Date(y,m-1,d);
  return (Date.now()-dt.getTime()<6*864e5) ? dt.toLocaleDateString('en-GB',{weekday:'long'}).toUpperCase() : dt.toLocaleDateString('en-GB',{day:'numeric',month:'short'}).toUpperCase(); };

function NoticeGood(){
  const {S,record,patch,today,confetti}=useFX();
  const G=DAILY_GRATITUDE_GOAL;
  const todayIds=S.dailyGratitudeSelections[today]||[];
  const count=todayIds.length; const reached=count>=G;
  const celebratedToday=S.gratitudeHistory.some(h=>h.date===today&&h.type==='daily-goal');
  const seen=useRef(new Set()); const topRef=useRef(null);
  const draw=mode=>{ let p=gratRecommend(S,G,new Set([...seen.current,...todayIds]),mode);
    if(p.length<G){ seen.current=new Set(); p=gratRecommend(S,G,new Set(todayIds),mode); }
    p.forEach(i=>seen.current.add(i.id)); return p; };
  const [pool,setPool]=useState(()=>draw('first'));
  useEffect(()=>{ patch(s=>{ const t=dayKey(); const sh={...s.gratitudeShown}; pool.forEach(i=>{ sh[i.id]=(sh[i.id]||0)+1; });
    const prev=s.gratitudeShownToday&&s.gratitudeShownToday.date===t?s.gratitudeShownToday.ids:[];
    return {...s,gratitudeShown:sh,gratitudeShownToday:{date:t,ids:[...new Set([...prev,...pool.map(i=>i.id)])].slice(-300)}}; }); },[pool]);
  const [fam,setFam]=useState(null); const create=useCreatePersonal();
  const [extra,setExtra]=useState([]); const [own,setOwn]=useState(false); const [ownText,setOwnText]=useState('');
  const [celebrate,setCelebrate]=useState(null);
  const cards=[...extra,...pool];
  const itemOf=id=>cards.find(c=>c.id===id)||gratItem(S,id);

  const addToday=s=>id=>{ const ids=[...(s.dailyGratitudeSelections[today]||[])]; if(ids.includes(id)) return s; ids.push(id);
    const c={...s.checkedGratitudeIds}; if(gratLib().byId[id]&&!c[id]) c[id]=today;
    return {...s,checkedGratitudeIds:c,dailyGratitudeSelections:{...s.dailyGratitudeSelections,[today]:ids}}; };
  const select=id=>{
    if(todayIds.includes(id)) return;
    const next=count+1;
    if(next>=G && !celebratedToday){
      const award=!earned(S,today,'dailyGratitude');
      record('dailyGratitude',20,s=>({...addToday(s)(id),gratitudeHistory:[...s.gratitudeHistory,{date:today,type:'daily-goal',goal:G}]}));
      confetti(); ding(980,.25); setCelebrate({award});
      setTimeout(()=>{ try{ topRef.current&&topRef.current.scrollIntoView({behavior:REDUCED?'auto':'smooth',block:'start'}); }catch(e){} },60);
    } else { patch(s=>addToday(s)(id)); ding(640+Math.min(next,14)*28,.07); }
  };
  const unselect=id=>patch(s=>{ const ids=(s.dailyGratitudeSelections[today]||[]).filter(x=>x!==id); const c={...s.checkedGratitudeIds};
    if(c[id]===today) delete c[id]; return {...s,checkedGratitudeIds:c,dailyGratitudeSelections:{...s.dailyGratitudeSelections,[today]:ids}}; });
  const tap=id=>todayIds.includes(id)?unselect(id):select(id);
  const addOwn=force=>{ const t=ownText.trim(); if(!t) return;
    if(force!==true){ const m=findFamiliar(S,t); if(m){ setFam(m); return; } }
    const g=create(t); setExtra(e=>[personalItem(g),...e]); setOwnText(''); setOwn(false); setFam(null); setTimeout(()=>select(g.id),0); };
  const useExisting=()=>{ const m=fam; setFam(null); setOwnText(''); setOwn(false);
    if(!cards.some(c=>c.id===m.id)) setExtra(e=>[personalItem(m),...e]); if(!todayIds.includes(m.id)) setTimeout(()=>select(m.id),0); };
  const more=()=>{ setPool(draw('more')); setCelebrate(null); try{ topRef.current&&topRef.current.scrollIntoView({behavior:REDUCED?'auto':'smooth',block:'start'}); }catch(e){} };
  const history=Object.entries(S.dailyGratitudeSelections).filter(([,ids])=>ids.length).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,7);

  return html`<div className="grat-scope">
    <div ref=${topRef}></div>
    <h1 className="game-title display">✨ NOTICE ${G} GOOD THINGS</h1>
    <p className="game-sub">What\u2019s already good today? Choose ${goalWord(G)} things you appreciate.</p>
    <${GratInsightCard}/>

    ${celebrate && html`<div className="dg-celebrate">
      <div className="dg-c1 display">✨ YOU FOUND ${G} GOOD THINGS.</div>
      <div className="dg-c2">And they were already part of your life.</div>
      <div className="dg-c3 display">LOOK AT WHAT\u2019S ALREADY HERE.</div>
      <div className="dg-c4">I can appreciate what I have and still create more.</div>
      ${celebrate.award && html`<div className="dg-pts">+20 Magnet Points ✨</div>`}
    </div>`}
    ${reached && html`<div className="dg-today">❤️ ${count} ${count===1?'thing':'things'} appreciated today</div>`}

    <div className="notice-grid">${cards.map(c=>{ const on=todayIds.includes(c.id); const k=todayIds.indexOf(c.id); return html`<button key=${c.id} className=${'notice-card'+(on?' on':'')} onClick=${()=>tap(c.id)} aria-pressed=${on}>
      ${on && html`<span className="nc-num">${k+1}</span>`}<span className="nc-e">${gratEmoji(c)}</span>${c.t}</button>`; })}</div>

    ${own ? html`<div className="row" style=${{marginTop:10}}><input className="input" placeholder="Something good today…" value=${ownText} onChange=${e=>setOwnText(e.target.value)} onKeyDown=${e=>{ if(e.key==='Enter') addOwn(); }}/><button className="btn small" onClick=${()=>addOwn()} disabled=${!ownText.trim()}>ADD</button></div>`
      : html`<button className="btn ghost" style=${{marginTop:10}} onClick=${()=>setOwn(true)}>+ MY OWN</button>`}
    ${fam && html`<${FamiliarBox} match=${fam} onUse=${useExisting} onDifferent=${()=>addOwn(true)}/>`}
    <button className="link-btn" onClick=${more}>Show me ${goalWord(G)} others</button>

    ${count>0 && html`<div className="card"><h2 className="h2">TODAY\u2019S GOOD THINGS</h2>
      <div className="want-chips" style=${{justifyContent:'flex-start',marginTop:10}}>${todayIds.map(id=>{ const it=itemOf(id); return it?html`<span key=${id} className="goal-pill">${gratEmoji(it)} ${it.t}</span>`:null; })}</div></div>`}

    ${history.length>0 && html`<div className="card"><h2 className="h2">DAILY GRATITUDE</h2>
      ${history.map(([d,ids])=>html`<div key=${d} className="moment-row"><span>${dayLabel(d)}</span><span>${ids.length} ${ids.length===1?'thing':'things'} noticed${ids.length>=G?' ✨':''}</span></div>`)}</div>`}

    <div className="itch-continue"><div className=${'dg-bar'+(reached?' done':'')}>
      <div className="dg-left"><span className="dg-count">${count} / ${G}${count>G?' ✨':''}</span>
        <span className="dg-track"><i style=${{width:Math.min(100,count/G*100)+'%'}}></i></span></div>
      ${reached ? html`<button className="btn warm small" onClick=${more}>❤️ KEEP NOTICING</button>`
        : html`<span className="dg-need">${count===0?`CHOOSE ${G}`:`CHOOSE ${G-count} MORE`}</span>`}
    </div>
    ${count===G && html`<div className="dg-noticed">✨ ${G} GOOD THINGS NOTICED · Look at how much is already here.</div>`}</div>
  </div>`;
}

function GratGame(){
  const {S,record,today,confetti}=useFX(); const {check}=useGrat();
  const [phase,setPhase]=useState('ready'); const [left,setLeft]=useState(60); const [deck,setDeck]=useState([]); const [i,setI]=useState(0); const [yes,setYes]=useState([]);
  const yesRef=useRef([]); const endRef=useRef(null);
  endRef.current=()=>{ const n=yesRef.current.length; record('gratGame',25,s=>{ const c={...s.checkedGratitudeIds}; yesRef.current.forEach(id=>{ if(!c[id]) c[id]=today; }); return {...s,checkedGratitudeIds:c,gratitudeHistory:[...s.gratitudeHistory,{date:today,type:'discovery',count:n}]}; }); if(n) confetti(); setPhase('done'); };
  useEffect(()=>{ if(phase!=='play') return; const start=Date.now();
    const t=setInterval(()=>{ const l=Math.max(0,60-(Date.now()-start)/1000); setLeft(l); if(l<=0){ clearInterval(t); endRef.current(); } },200); return ()=>clearInterval(t); },[phase]);
  const start=()=>{ setDeck(gratRandom(S,200)); setI(0); setYes([]); yesRef.current=[]; setLeft(60); setPhase('play'); };
  const answer=y=>{ const it=deck[i]; if(y){ yesRef.current=[...yesRef.current,it.id]; setYes(yesRef.current); ding(720+(yesRef.current.length%8)*40,.07); } setI(x=>x+1); };
  if(phase==='ready') return html`<div className="grat-scope center">
    <h1 className="game-title display">✨ HOW MUCH GOOD CAN YOU NOTICE?</h1>

  </div>`;
  if(phase==='done') return html`<div className="grat-scope center">
    <h1 className="game-title display">YOU NOTICED ${yes.length} GOOD ${yes.length===1?'THING':'THINGS'} ✨</h1>
    <p className="display" style=${{fontSize:'1.25rem',fontWeight:700}}>There is more richness in ordinary life than we usually stop to notice.</p>
    <div className="want-chips" style=${{marginTop:12}}>${yes.slice(0,12).map(id=>html`<span key=${id} className="goal-pill">${gratLib().byId[id].t}</span>`)}</div>
    <div style=${{marginTop:16}}><button className="btn warm" onClick=${start}>NOTICE AGAIN</button></div>
  </div>`;
  const it=deck[i]; const C=it&&gratLib().cat[it.c];
  return html`<div className="grat-scope center">
    <div className="arena-hud" style=${{position:'static',justifyContent:'space-between'}}><span className="chip">⏱ ${Math.ceil(left)}s</span><span className="chip">❤️ ${yes.length}</span></div>
    ${it && html`<div className="surprise-card" key=${it.id}><span className="sc-cat">${C.e} ${C.n}</span><b className="display">${it.t.replace(/\.$/,'')}</b></div>`}
    <div className="btn-row"><button className="btn ghost" onClick=${()=>answer(false)}>NEXT</button><button className="btn warm" onClick=${()=>answer(true)}>❤️ YES</button></div>
  </div>`;
}

function EvidenceTab(){
  const {S,record,patch,toast,today}=useFX();
  const [open,setOpen]=useState(false);
  const [f,setF]=useState({text:'',amount:'',cat:'SAVED'});
  const [ph]=useState(()=>pick(EV_EXAMPLES));
  const totalDKK=S.evidence.reduce((a,e)=>a+(e.amount||0),0);
  const save=()=>{ if(!f.text.trim()) return; const amt=parseNum(f.amount);
    const entry={id:uid(),date:today,text:f.text.trim(),amount:amt||null,cat:f.cat};
    record('evidence',50,s=>({...s,evidence:[entry,...s.evidence]}));
    toast(amt?`+${fmt(amt)} MONEY EVIDENCE`:`${f.cat} ADDED ✨`); setF({text:'',amount:'',cat:f.cat}); setOpen(false); };
  const del=id=>{ if(window.confirm('Delete this piece of evidence?')) patch(s=>({...s,evidence:s.evidence.filter(e=>e.id!==id)})); };
  return html`<div className="wrap">
    <header className="hero"><div className="eyebrow">MONEY EVIDENCE VAULT</div><h1 className="brand display" style=${{fontSize:'2.3rem'}}>Proof from real life</h1>
      <p style=${{fontWeight:700,margin:'6px auto 0',maxWidth:'30ch'}}>Notice every piece of evidence that your financial world can change.</p></header>
    <div className="ev-total">
      <div className="stat"><div className="sv">${S.evidence.length}</div><div className="sl">TOTAL MONEY EVIDENCE · events</div></div>
      <div className="stat"><div className="sv">${fmtShort(totalDKK)}</div><div className="sl">DKK in real entries</div></div>
    </div>
    <div style=${{marginTop:14}}><button className="btn sea" onClick=${()=>setOpen(true)}>+ ADD MONEY WIN</button></div>
    <div className="card">
      ${S.evidence.length===0 ? html`<p style=${{fontWeight:700,margin:0}}>Nothing here yet. Saved 40 kr? Waited before buying? Moved money to Future Me? Bought something and felt good about it? It all counts as money evidence ✨</p>`
        : S.evidence.map(e=>html`<div key=${e.id} className="ev"><span className="tag">${e.cat}</span><div style=${{flex:1}}><div style=${{fontWeight:800}}>${e.text}</div><div className="muted small" style=${{fontWeight:700}}>${prettyDate(e.date)}${e.amount?` · ${fmt(e.amount)} DKK`:''}</div></div><button className="x" aria-label="Delete" onClick=${()=>del(e.id)}>✕</button></div>`)}
    </div>
    <p className="disclaimer">Real life only. Game money never counts here.</p>
    ${open && html`<${Modal} onClose=${()=>setOpen(false)} label="Add money win">
      <h3>Add a money win</h3>
      <label className="lbl" htmlFor="et">WHAT HAPPENED?</label>
      <textarea id="et" className="input" placeholder=${ph} value=${f.text} onChange=${e=>setF({...f,text:e.target.value})}></textarea>
      <label className="lbl" htmlFor="ea">AMOUNT (DKK) — OPTIONAL</label>
      <input id="ea" className="input" inputMode="numeric" placeholder="40" value=${f.amount} onChange=${e=>{ const v=parseNum(e.target.value); setF({...f,amount:v?fmt(v):''}); }}/>
      <label className="lbl">CATEGORY</label>
      <div className="cats">${EV_CATS.map(c=>html`<button key=${c} className=${f.cat===c?'on':''} onClick=${()=>setF({...f,cat:c})}>${c}</button>`)}</div>
      <div className="btn-row"><button className="btn ghost" onClick=${()=>setOpen(false)}>CANCEL</button><button className="btn" disabled=${!f.text.trim()} onClick=${save}>ADD EVIDENCE</button></div>
    <//>`}
  </div>`;
}

function MeTab(){
  const {S,patch,resetAll,today,open}=useFX();
  const [confirm,setConfirm]=useState(false);
  const {toast,restore}=useFX();
  const exportData=()=>{ try{ const blob=new Blob([JSON.stringify({app:'money-magnet',version:1,exported:new Date().toISOString(),data:S},null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`money-magnet-backup-${today}.json`; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500); toast('Backup saved ✨'); }catch(e){ toast('Backup failed on this browser'); } };
  const importData=e=>{ const file=e.target.files&&e.target.files[0]; e.target.value=''; if(!file) return;
    const r=new FileReader(); r.onload=()=>{ try{ const j=JSON.parse(r.result); const data=j&&j.app==='money-magnet'?j.data:null;
      if(!data||typeof data.points!=='number'){ toast('That file isn\u2019t a Money Magnet backup'); return; }
      if(!window.confirm('Replace everything on this device with this backup?')) return; restore(data); toast('Backup restored ✨'); }catch(err){ toast('Could not read that file'); } }; r.readAsText(file); };
  const L=levelOf(S.points);
  const days=Object.entries(S.days);
  const practiced=days.filter(([,d])=>Object.keys(d.acts||{}).length>0).length;
  const sessions=days.filter(([,d])=>d.session).length;
  const alive=S.lastDay===today||S.lastDay===addDays(today,-1);
  const t=thermoSummary(S.thermo);
  const lastSeller=S.seller[S.seller.length-1];
  const last14=Array.from({length:14},(_,i)=>addDays(today,i-13));
  const max14=Math.max(50,...last14.map(k=>(S.earned[k]||{}).total||0));
  const answers=Object.entries(S.answers).sort((a,b)=>b[0].localeCompare(a[0]));
  const stats=[
    [practiced,'Days practiced'],[L.name,'Magnet level'],[S.wsDone,'Money Search puzzles'],[S.flips,'Old stories flipped'],
    [S.evidence.length,'Real money evidence'],[t.shifts,'Thermostat shifts'],
    [lastSeller?(lastSeller.point>=SELL_LEVELS.length?'∞':fmtShort(SELL_LEVELS[lastSeller.point]*lastSeller.price)):'—','Seller expansion point'],
    [alive?S.streak:0,'Current streak'],[S.longest,'Longest streak'],[CREATURE[L.idx],'Creature stage'],
    [S.moments.length,'Intentional money moments'],[gratCount(S),'Things appreciated'],[S.glitches.length,'Glitches found'],[fmtShort(S.goals.reduce((a,g)=>a+(g.real||0),0)),'DKK really saved'],[S.stays.length,'Let It Stay rounds']
  ];
  const momentCounts=Object.keys(MOMENT_LABELS).map(k=>[k,S.moments.filter(m=>m.type===k).length]).filter(([,n])=>n>0);
  return html`<div className="wrap">
    <header className="hero"><div className="eyebrow">ME</div><h1 className="brand display" style=${{fontSize:'2.3rem'}}>Your progress</h1></header>
    <div className="stats">${stats.map(([v,l])=>html`<div key=${l} className="stat"><div className="sv" style=${{fontSize:String(v).length>6?'1.35rem':undefined}}>${v}</div><div className="sl">${l}</div></div>`)}</div>
    <div className="card">
      <div className="row-between"><h2 className="h2">INTENTIONAL MONEY MOMENTS</h2><span className="pill">${S.moments.length}</span></div>
      <p className="muted small" style=${{margin:'4px 0 6px',fontWeight:700}}>Awareness and choice — not spending as little as possible.</p>
      ${momentCounts.length?momentCounts.map(([k,n])=>html`<div key=${k} className="moment-row"><span>${MOMENT_LABELS[k]}</span><span>${n}</span></div>`):html`<p style=${{fontWeight:700,margin:0}}>Use the Itch, Payday Power, Future Me or Let It Stay to start collecting moments.</p>`}
    </div>
    <div className="card">
      <div className="row-between"><h2 className="h2">30-DAY MONEY MINDSET JOURNEY</h2><span className="pill">${Math.min(sessions,30)}/30</span></div>
      <p className="muted small" style=${{margin:'4px 0 0',fontWeight:700}}>A light turns on for each completed daily reset.</p>
      <div className="journey">${Array.from({length:30},(_,i)=>html`<i key=${i} className=${i<sessions?'on':''}>${i+1}</i>`)}</div>
    </div>
    <div className="card">
      <h2 className="h2">MAGNET POINTS · LAST 14 DAYS</h2>
      <div className="bars14">${last14.map(k=>{ const v=(S.earned[k]||{}).total||0; return html`<div key=${k}><i style=${{height:(v/max14*100)+'%'}} title=${v+' points'}></i><small>${Number(k.slice(8))}</small></div>`; })}</div>
    </div>
    ${answers.length>0 && html`<div className="card"><div className="row-between"><h2 className="h2">MY ANSWERS</h2><button className="btn tiny ghost" onClick=${()=>open('question')}>TODAY</button></div>
      ${answers.slice(0,6).map(([d,v])=>html`<div key=${d} style=${{padding:'12px 0',borderBottom:'1px solid var(--line)'}}><div className="muted small" style=${{fontWeight:800}}>${prettyDate(d)} · ${v.q}</div><div style=${{fontWeight:700,marginTop:4}}>${v.a}</div></div>`)}</div>`}
    <div className="card">
      <h2 className="h2">SETTINGS</h2>
      <div className="setting"><span>Sound effects</span><button className=${'switch'+(S.sound?' on':'')} role="switch" aria-checked=${S.sound} aria-label="Sound effects" onClick=${()=>patch(s=>({...s,sound:!s.sound}))}></button></div>
      <div className="setting"><span>Back up my data</span><button className="btn tiny ghost" onClick=${exportData}>SAVE FILE</button></div>
      <div className="setting"><span>Restore from backup</span><label className="btn tiny ghost" style=${{cursor:'pointer'}}>CHOOSE FILE<input type="file" accept="application/json,.json" style=${{display:'none'}} onChange=${importData}/></label></div>
      <div className="setting"><span>Replay the welcome</span><button className="btn tiny ghost" onClick=${()=>patch(s=>({...s,onboarded:false}))}>REPLAY</button></div>
      <div className="setting"><span>Reset all data</span><button className="btn tiny danger" onClick=${()=>setConfirm(true)}>RESET</button></div>
    </div>
    <p className="disclaimer">Everything is stored only on this device — save a backup now and then. Money Magnet is a mindset practice, not financial advice.</p>
    ${confirm && html`<${Modal} onClose=${()=>setConfirm(false)} label="Reset all data">
      <h3>Reset all data?</h3>
      <p style=${{fontWeight:700}}>This permanently deletes your Magnet Points, streaks, stories, dreams, evidence and answers on this device. It can't be undone.</p>
      <div className="btn-row"><button className="btn ghost" onClick=${()=>setConfirm(false)}>KEEP MY DATA</button><button className="btn danger" onClick=${()=>{ setConfirm(false); resetAll(); }}>DELETE EVERYTHING</button></div>
    <//>`}
  </div>`;
}

/* ================= ONBOARDING ================= */
function Onboarding({onDone}){
  const [step,setStep]=useState(0);
  const steps=[
    html`<div className="onb-step" key="0"><${Creature} stage=${0} size=${170}/><h1 className="brand display">MONEY MAGNET ✨</h1><div className="big">What if money started feeling different?</div><p>This is your space to practice new thoughts about earning, receiving, keeping and growing money.</p></div>`,
    html`<div className="onb-step" key="1"><${Creature} stage=${1} size=${170}/><div className="big">We're not chasing money today.</div><p>We're practicing becoming comfortable with possibility.</p></div>`,
    html`<div className="onb-step" key="2"><${Creature} stage=${2} size=${170}/><div className="big">3 minutes a day.</div><p>Let's begin.</p></div>`
  ];
  return html`<div className="onb">
    ${steps[step]}
    <div className="dots" aria-hidden="true">${steps.map((_,i)=>html`<i key=${i} className=${i===step?'on':''}></i>`)}</div>
    ${step<2 ? html`<button className="btn" onClick=${()=>setStep(step+1)}>CONTINUE</button>` : html`<button className="btn pink" onClick=${onDone}>START MY MONEY RESET</button>`}
  </div>`;
}

/* ================= APP ================= */
const SCREENS={ws:WordSearch,flip:FlipIt,rain:MoneyRain,store:Store,thermo:Thermostat,spend:SpendMillions,seller:Seller,question:DailyQuestion,glitch:GlitchFlow,vault:GlitchVault,itch:Itch,future:FutureMe,payday:Payday,wishlist:Wishlist,stay:LetItStay,gratitude:GratitudeHome,gratexplore:GratExplore,gratsurprise:GratSurprise,gratmine:GratMine,noticegood:NoticeGood,gratgame:GratGame,gratmoney:GratMoney,mymessages:MyMessages};
const HUBS=['gratitude','future','vault'];
const TABS=[{id:'today',i:'🏠',n:'TODAY'},{id:'play',i:'🎮',n:'PLAY'},{id:'magnet',i:'✨',n:'MAGNET'},{id:'evidence',i:'💰',n:'EVIDENCE'},{id:'me',i:'👤',n:'ME'}];

function App(){
  const [S,setS]=useState(load);
  const [tab,setTab]=useState('today');
  const [screen,setScreen]=useState(null);
  const [toasts,setToasts]=useState([]);
  const [conf,setConf]=useState(0);
  const [levelUp,setLevelUp]=useState(null);
  const pending=useRef([]);
  const [today,setToday]=useState(dayKey());
  useEffect(()=>{ const t=setInterval(()=>{ const k=dayKey(); setToday(p=>p===k?p:k); },30000); const v=()=>setToday(dayKey()); document.addEventListener('visibilitychange',v); return ()=>{ clearInterval(t); document.removeEventListener('visibilitychange',v); }; },[]);
  useEffect(()=>{ persist(S); SOUND.on=!!S.sound; },[S]);

  const toast=useCallback(text=>{ const id=uid(); setToasts(t=>[...t.slice(-2),{id,text}]); setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),2600); },[]);
  const confetti=useCallback(()=>{ setConf(c=>c+1); ding(880,.18); },[]);
  const patch=useCallback(fn=>setS(prev=>fn(prev)),[]);
  const record=useCallback((act,amt,fn)=>setS(prev=>{
    let s=fn?fn(prev):prev; const fx=[]; let got=0;
    if(act){ s=applyPractice(s,act); [s,got]=applyEarn(s,act,amt||0); if(got) fx.push({type:'points',amt:got}); }
    const t=dayKey(); const plan=todayPlan(t); const d=s.days[t];
    if(d&&!d.session&&plan.every(a=>d.acts[a.id])){ s={...s,days:{...s.days,[t]:{...d,session:true}}}; let g2; [s,g2]=applyEarn(s,'session',100); fx.push({type:'session',amt:g2}); }
    const before=levelOf(prev.points).idx, after=levelOf(s.points).idx;
    if(after>before) fx.push({type:'level',idx:after});
    pending.current.push(...fx);
    return s;
  }),[]);
  useEffect(()=>{ if(!pending.current.length) return; const fx=pending.current; pending.current=[];
    fx.forEach(f=>{
      if(f.type==='points') toast(`+${f.amt} Magnet Points ✨`);
      if(f.type==='session'){ setConf(c=>c+1); toast(f.amt?`Today's reset complete · +${f.amt}`:`Today's reset complete ✨`); }
      if(f.type==='level'){ setTimeout(()=>{ setLevelUp(f.idx); setConf(c=>c+1); },700); }
    }); },[S,toast]);

  const plan=useMemo(()=>todayPlan(today),[today]);
  const open=useCallback((id,session=false,arg=null)=>setScreen(p=>{ let prev=p?(HUBS.includes(p.id)?{id:p.id,session:p.session,arg:p.arg,prev:p.prev}:p.prev):null;
    while(prev&&prev.id===id) prev=prev.prev; return {id,session,arg,n:((p&&p.n)||0)+1,prev}; }),[]);
  const close=useCallback(()=>setScreen(p=>p&&p.prev?{...p.prev,n:p.n+1}:null),[]);
  const resetAll=useCallback(()=>{ try{ localStorage.removeItem(KEY); }catch(e){} setS(DEFAULT()); setTab('today'); setScreen(null); },[]);
  useEffect(()=>{ document.body.style.overflow=screen?'hidden':''; },[screen]);

  const restore=useCallback(data=>{ setS({...DEFAULT(),...data,onboarded:true}); setTab('today'); },[]);
  const logEvidence=useCallback((text,cat,amount)=>{ record('evidence',50,s=>({...s,evidence:[{id:uid(),date:dayKey(),text,amount:amount||null,cat},...s.evidence]})); toast(`${cat} ADDED ✨`); },[record,toast]);
  const ctx={S,record,patch,toast,confetti,open,close,plan,today,resetAll,restore,logEvidence};
  const Comp=screen?SCREENS[screen.id]:null;

  return html`<${FX.Provider} value=${ctx}>
    ${!S.onboarded ? html`<${Onboarding} onDone=${()=>patch(s=>({...s,onboarded:true}))}/>` : html`<div>
      ${tab==='today'&&html`<${TodayTab}/>`}
      ${tab==='play'&&html`<${PlayTab}/>`}
      ${tab==='magnet'&&html`<${MagnetTab}/>`}
      ${tab==='evidence'&&html`<${EvidenceTab}/>`}
      ${tab==='me'&&html`<${MeTab}/>`}
      <nav className="nav" aria-label="Main"><div className="nav-inner">${TABS.map(t=>html`<button key=${t.id} className=${tab===t.id?'on':''} aria-current=${tab===t.id?'page':undefined} onClick=${()=>{ setTab(t.id); window.scrollTo(0,0); }}><span className="ni">${t.i}</span>${t.n}</button>`)}</div></nav>
    </div>`}
    ${Comp && html`<div className="screen" key=${"scr"+screen.n} role="dialog" aria-label=${SCREEN_TITLES[screen.id]}>
      <div className="screen-head"><button className="icon-btn" onClick=${close} aria-label="Back">‹</button><div className="screen-title">${SCREEN_TITLES[screen.id]}</div><span className="chip" style=${{padding:'6px 10px'}}>✨ ${fmt(S.points)}</span></div>
      <div className="screen-body"><${Comp} key=${screen.id+"-"+screen.n} arg=${screen.arg}/></div>
      ${screen.session && html`<${SessionBar} current=${screen.id}/>`}
    </div>`}
    ${levelUp!==null && html`<${Modal} onClose=${()=>setLevelUp(null)} label="Level up">
      <div className="creature-stage"><div className="eyebrow">NEW LEVEL</div><${Creature} stage=${levelUp} size=${190}/><h3>${LEVELS[levelUp].name} ✨</h3><p style=${{fontWeight:700,marginTop:0}}>Your creature evolved into ${CREATURE[levelUp]}. ${CREATURE_BLURB[levelUp]}</p>
      <button className="btn" onClick=${()=>setLevelUp(null)}>KEEP GROWING</button></div>
    <//>`}
    <div className="toasts" aria-live="polite">${toasts.map(t=>html`<div key=${t.id} className="toast">${t.text}</div>`)}</div>
    <${Confetti} trigger=${conf}/>
  <//>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
if('serviceWorker' in navigator && location.protocol==='https:'){ window.addEventListener('load',()=>{ navigator.serviceWorker.register('./sw.js').catch(()=>{}); }); }
</script>
</body>
