  </section>
  <section><div class="tierhead"><span class="tier nice">Nice to have</span><h2>My goals for this recipe</h2></div><p class="sub">Pick as many as you like.</p>
    <div class="chips" style="margin-top:12px">${GOALS.map(q=>`<button class="chip goal ${N.goals.includes(q)?'on':''}" data-act="wiz-goal" data-v="${esc(q)}" aria-pressed="${N.goals.includes(q)}">${N.goals.includes(q)?I.check:''}${esc(q)}</button>`).join('')}</div>
  </section>
  <section><h2>What texture do you want?</h2><p class="sub">Pick up to two. This changes how I adapt it.</p>
    <div class="chips" style="margin-top:12px">${texOpts.map(t=>`<button class="chip tex ${N.texture.includes(t)?'on':''}" data-act="wiz-texture" data-v="${t}" aria-pressed="${N.texture.includes(t)}">${N.texture.includes(t)?I.check:''}${TEXTURE_LABEL[t]}</button>`).join('')}
    <button class="chip tex ${N.texture.includes('keep')?'on':''}" data-act="wiz-texture" data-v="keep">${N.texture.includes('keep')?I.check:''}Keep original texture</button>
    <button class="chip ${!N.texture.length?'on':''}" data-act="wiz-texture" data-v="">No preference</button></div>
  </section>
  <section><h2>How much should I change?</h2>
    <div class="strength" style="margin-top:12px">${STRENGTHS.map(([k,l,d])=>`<button class="${N.strength===k?'on':''}" data-act="wiz-strength" data-v="${k}" aria-pressed="${N.strength===k}"><b>${l}</b><small>${d}</small></button>`).join('')}</div>
  </section>
  <section><button class="usepantry ${N.usePantry?'on':''}" data-act="wiz-usepantry" aria-pressed="${!!N.usePantry}"><span class="pcheck ${N.usePantry?'on':''}">${N.usePantry?'✓':''}</span><span><b>Prioritize ingredients I already have</b><small>Smart Treats will try to adapt this recipe using your pantry before suggesting things to buy. Recipe quality and your must-haves come first.</small></span></button></section>
  <section><h2>Portion size</h2>
    <div class="seg" style="margin-top:12px">${[['keep','Keep original portion size'],['optimize','Optimize portions']].map(([k,l])=>`<button class="${N.portion===k?'on':''}" data-act="wiz-portion" data-v="${k}">${l}</button>`).join('')}</div>
    ${N.portion==='optimize'?'<p class="sub" style="margin-top:8px">I may suggest smaller portions, and I\'ll show how much of the difference comes from portion size.</p>':''}
  </section>
  ${N.priorities.length?`<section><h2>What matters most?</h2><p class="sub">Must haves always come first. Order your nice-to-haves in case they pull in different directions.</p>
  <div class="rank">${N.priorities.map((p,ix)=>{const gi=goalsP.indexOf(p);return `<div class="rank-row"><span class="n">${ix+1}</span><div><b>${esc(p.key)}</b>${p.kind==='req'?`<span class="lock">Must have</span>`:`<div class="lvl">${[['high','High priority'],['preferred','Nice to have']].map(([k,l])=>`<button class="${p.level===k?'on':''}" data-act="wiz-level" data-i="${ix}" data-v="${k}">${l}</button>`).join('')}</div>`}</div>

}

  ${A.tags.length?`<div class="badges" style="margin-top:12px">${A.tags.map(t=>`<span class="badge ${GOALS.includes(t)?'y':''}">${esc(t)}</span>`).join('')}</div>`:''}
  <div>${engineBadge(A.engine)}</div>

  ${A.notes?`<p class="note y">${esc(A.notes)}</p>`:''}
  <section><h2>What I changed</h2>${A.changes.length?`<div class="stack" style="margin-top:12px">${A.changes.map(changeCard).join('')}</div>`:'<p class="sub" style="margin-top:8px">Nothing needed changing — this recipe already fits what you chose.</p>'}</section>
  <section>${collagenCard(A.collagen)}</section>
  <section class="card"><h2>My Recipe</h2>
    <div class="meta3"><div><small>Makes</small><b>${A.servings||'—'} ${A.servings?noun+(A.servings>1?'s':''):''}</b></div><div><small>Prep</small><b>${esc(A.prepTime||'—')}</b></div><div><small>Cook</small><b>${esc(A.cookTime||'—')}</b></div></div>
    ${A.tempText?`<p class="note" style="margin-top:10px"><b>Oven:</b> ${esc(A.tempText)}</p>`:''}
    <h3 style="margin-top:18px">Your ingredients</h3>${activeProducts().length?(()=>{const C=checkRecipeAgainstPantry({adaptedIngredients:A.ingredients,userRequirements:W.needs.reqs});return `<div class="yi">${C.rows.map(x=>`<div class="yi-row ${x.status==='have'?'have':'need'}">${x.status==='have'?HAVE_IC:NEED_IC}<div><b>${esc(x.line)}${x.optional?' <span class="muted">(optional)</span>':''}</b><small>${x.basic?'From the tap':x.status==='have'?(x.match?locLabel(x.match.product).toUpperCase():'IN YOUR PANTRY'):x.status==='partial'?`NEED ${esc(fmtQtyObj(x.remaining).toUpperCase())} MORE`:'NEED TO BUY'}${x.match&&x.match.level==='compatible'&&x.match.note?` · ${esc(x.match.note)}`:''}</small></div></div>`).join('')}</div>`})():ingListHTML(A.ingredients)}
    ${(A.pantrySuggestions||[]).length?`<p class="note y"><b>From your pantry:</b> ${A.pantrySuggestions.map(p=>`you have ${esc(p.product)} (${esc(p.location.toLowerCase())}), which could replace ${esc(p.ingredient)}`).join('; ')}. Turn on “Prioritize ingredients I already have” to use it.</p>`:''}
    <h3 style="margin-top:22px">Method</h3>${stepsListHTML(A.instructions)}
    ${A.storage?`<p class="note"><b>Storage:</b> ${esc(A.storage)}</p>`:''}

  <section class="card"><h2>Nutrition</h2><p class="sub">Per ${noun}. ${A.nutrition.source==='label'?'Label-based':'Estimated'} from typical ingredient values — never exact.</p>

    ${missingNote(A.nutrition)}</section>
  <section>${fold('Original recipe',`<div class="vs"><div><h4>Original</h4><ul>${O.ingredients.map(i=>`<li>${esc(lineOf(i))}</li>`).join('')}</ul></div><div class="mine"><h4>Mine</h4><ul>${A.ingredients.map(i=>`<li>${esc(lineOf(i))}</li>`).join('')}</ul></div></div>`,'Kept safe')}</section>
  <section class="card" style="text-align:center"><h3>Want full control?</h3><p class="sub">Save it and open the ingredient and method editor.</p>
    <button class="btn btn-ghost" style="margin-top:12px" data-act="wiz-save" data-v="edit">${I.pen} Edit it myself</button>

function wizError(){

function screenAdd(){
  if(!W)resetWizard();
  switch(W.stage){case 'reading':return wizReading();case 'found':return wizFound();case 'needs':return wizNeeds();case 'working':return wizWorking();case 'result':return W.result?wizResult():wizNeeds();case 'error':return wizError();default:return wizImport()}
}

/* ============ REVISION (Improve this recipe) ============ */
function screenRevise(){
  const r=getR(ui.id); if(!r||!r.pendingRevision){ui.screen='kitchen';return screenKitchen()}
  const R=r.pendingRevision, n=nextVersionN(r), rescue=R.kind==='rescue';
  const top=`<div class="topbar"><div class="left"><button class="iconbtn" data-act="back">${I.back} Back</button></div><div class="topbar-title">${rescue?'Recipe Rescue':'Improve this recipe'}</div><div class="right" style="min-width:48px"></div></div>`;
  if(R.state==='working')return `${top}<div class="working"><div class="whisker">${I.whisk}</div><h1 class="wtitle">${rescue?"Let's figure out what happened…":`Planning version ${n}…`}</h1><p class="sub">${rescue?'Looking at the ratios, method and changes in this version.':'Using your test notes and earlier versions.'}</p>${engineBadge(R.engine)}<div class="stream" id="w-stream" ${R.engine==='claude'?'':'hidden'}>Thinking…</div></div>`;
  if(R.state==='error')return `${top}<div class="working"><h1 class="wtitle">That didn't work</h1><p class="sub">${esc(R.error||'')}</p><div class="stack" style="margin-top:20px"><button class="btn btn-primary" data-act="revise-run" data-id="${r.id}">${I.refresh} Try again</button><button class="btn btn-soft" data-act="revise-run" data-id="${r.id}" data-rules="1">Use built-in rules instead</button><button class="btn btn-ghost" data-act="revise-discard" data-id="${r.id}">Not now</button></div></div>`;
  const P=R.proposal, c=calculateNutrition(P.ingredients,r.servings), cur=nut(r), has=P.changes.length>0;
  const cause=x=>`<div class="chg"><div class="chg-top"><h4 style="font-weight:800">${esc(x.text)}</h4></div><div class="badges" style="margin-top:8px"><span class="pill conf-${x.confidence}">${CONF_LABEL[x.confidence]}</span>${x.evidence?`<span class="badge">${esc(x.evidence)}</span>`:''}</div></div>`;
  return `${top}
  <span class="ready-badge">${rescue?I.whisk+' '+esc(PROBLEMS[R.problem]||'Something went wrong'):I.spark+` Version ${r.currentVersion} → ${n}`}</span>
  <h1 class="rname">${esc(r.name)}</h1>${engineBadge(R.engine)}
  ${P.summary?`<p class="note">${esc(P.summary)}</p>`:''}
  ${P.causes&&P.causes.length?`<section><h2>What may have happened</h2><p class="sub">Possibilities, not certainties — ordered by how likely they seem for this recipe.</p><div class="stack" style="margin-top:12px">${P.causes.map(cause).join('')}</div></section>`:''}
  <section><h2>${rescue?'What I would change':"Here's what I'd change next time"}</h2>${has?`<div class="stack" style="margin-top:12px">${P.changes.map(c=>changeCard(c,[`Version ${r.currentVersion}`,`Version ${n}`])).join('')}</div>`:'<p class="sub" style="margin-top:8px">No ingredient changes to suggest.</p>'}</section>
  ${has&&cur.complete&&c.complete?`<section class="card"><h2>Nutrition per ${unitNoun(r)}</h2>${nutTable([{label:`Version ${r.currentVersion}`,per:cur.per},{label:`Version ${n}`,per:c.per}])}</section>`:''}
  ${has?`<section class="card"><h2>Version ${n}</h2>${metaHTML({cookTime:P.cookTime,tempText:P.tempText})}<h3 style="margin-top:14px">Ingredients</h3>${ingListHTML(P.ingredients)}<h3 style="margin-top:22px">Method</h3>${stepsListHTML(P.instructions)}</section>
  <p class="sub" style="margin-top:14px">Version ${r.currentVersion}${perfectVersion(r)?` and your Perfect Version stay`:' stays'} exactly as ${perfectVersion(r)?'they are':'it is'}.</p>
  <section class="stack"><button class="btn btn-ghost" data-act="revise-accept" data-id="${r.id}" data-edit="1">${I.pen} Create it, then edit myself</button><button class="btn btn-ghost" data-act="revise-discard" data-id="${r.id}">Not now</button></section>
  <div class="footbar"><div class="footbar-in"><button class="btn btn-primary" data-act="revise-accept" data-id="${r.id}">${I.plus} Create version ${n}</button></div></div>`
  :`<section class="stack">${!rescue&&!perfectVersion(r)?`<button class="btn btn-primary" data-act="perfect" data-id="${r.id}">${I.star} Save as my Perfect Version</button>`:''}<button class="btn btn-ghost" data-act="revise-discard" data-id="${r.id}">Back</button></section>`}`;
}

function compress(file,max=1100,q=.8){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{let w=img.naturalWidth,h=img.naturalHeight;const s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);res(c.toDataURL('image/jpeg',q))};img.onerror=()=>rej(new Error('img'));img.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}
let photoTarget=null;
function pickPhoto(target,id,capture){
  photoTarget={target,id};
  const inp=$(capture?'#file-cam':'#file-img'); inp.value=''; inp.click();
}
async function onPhoto(file){
  if(!file||!photoTarget)return;
  try{
    const data=await compress(file);
    if(photoTarget.target==='product-new'){const big=await compress(file,1400,.82);photoTarget=null;return startProductFromPhoto(big,ui.photoMode||'photo')}
    if(photoTarget.target==='product-edit'){ui.pdraft.photo=await shrinkDataURL(await compress(file,1200,.8),600,.75);render();return}
    if(photoTarget.target==='mine'){const r=getR(photoTarget.id);if(r){r.photo=data;r.updatedAt=Date.now();persist()}}
    else{const o=E();if(o){o.referencePhoto=data;if(ui.id)persist();else{draft.step=Math.max(draft.step||1,1);saveDraft()}}
      if(!ui.id&&ui.step===1){ui.step=2;draft.step=2;saveDraft()}}
    render(); toast('Photo saved');
  }catch(e){toast("That image couldn't be opened. Try a JPG or PNG.")}
}

/* ============ export / import / print ============ */
async function getCap(name){try{if(window.claude&&typeof window.claude.use==='function')return await window.claude.use(name)}catch(e){}return null}
async function saveFile(filename,text,mime){
  const dl=await getCap('downloads');
  if(dl){try{await dl.save({filename,data:text});toast('Saved');return true}catch(e){if(e&&e.code==='declined'){toast('Download cancelled');return false}}}
  try{const blob=new Blob([text],{type:mime});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);toast('Download started');return true}catch(e){toast("Download isn't available here. Use Copy instead.");return false}
}

function doImport(text){
  let obj; try{obj=JSON.parse(text)}catch(e){toast("That isn't a Smart Treats backup.");return}
  const d=obj&&obj.data?obj.data:obj;
  if(!d||!Array.isArray(d.recipes)){toast("That isn't a Smart Treats backup.");return}
  confirmSheet('Replace everything?',`This backup has ${d.recipes.length} ${d.recipes.length===1?'recipe':'recipes'}. Your current data on this device will be replaced.`,'Replace with backup',()=>{DB=normalize(d);persist();ui.servings={};ui.checks={};nav('home',{reset:true});toast('Cookbook restored')},true);
}
function printRecipeHTML(r){
  const p=ps(r);

  return `<section class="p-recipe"><h1>${esc(r.name)}</h1><p class="p-meta">${esc(r.category)} — ${hasServings(r)?`Serves ${num(r.servings)} (1 ${servingUnitOf(r)} each)`:'Serving count needed'}${yieldText(r)?` — Makes ${yieldText(r)}`:''}${p.any?` — Per serving (${nLabel(r).toLowerCase()}): ${fmtN(p.kcal,'kcal')} kcal, ${fmtN(p.protein)} g protein, ${fmtN(p.carbs)} g carbs, ${fmtN(p.fat)} g fat, ${fmtN(p.fiber)} g fiber`:''}</p>
  ${r.description?`<p>${esc(r.description)}</p>`:''}${r.requirements.length?`<p class="p-meta">${esc(r.requirements.join(', '))}</p>`:''}
  <h2>Ingredients</h2>${ings||'<p>—</p>'}<h2>Method</h2><ol>${r.adaptedInstructions.filter(s=>s.trim()).map(s=>`<li>${esc(s)}</li>`).join('')}</ol>
  ${r.versionNotes?`<h2>Notes</h2><p>${esc(r.versionNotes)}</p>`:''}
  ${r.smartSwaps.length?`<h2>Smart swaps</h2><ul>${r.smartSwaps.map(s=>`<li>${esc(s.original)} → ${esc(s.swap)}${s.why?` — ${esc(s.why)}`:''}</li>`).join('')}</ul>`:''}
  ${r.collagen.amount?`<h2>Collagen</h2><p>${esc(r.collagen.amount)}${r.collagen.how?` — ${esc(r.collagen.how)}`:''}</p>`:''}</section>`;
}

  if(fresh||!draft){draft=null;ensureDraft()}
  nav('edit',{id:null,step:draft.step||1,reset:true});
}
function goStep(n){
  const o=E(); if(!o)return;
  if(ui.id&&ui.step===3&&n!==3&&o.status==='idea'&&o.adaptedIngredients.length){o.status='adapted';persist()}
  ui.step=n; if(!ui.id){draft.step=n;saveDraft()}
  render(); window.scrollTo(0,0);
}
function saveOriginal(){
  const d=draft; if(!d.name.trim()){toast('Give the recipe a name first.');const f=$('#f-name');if(f)f.focus();return}

/** add from a shopping list / recipe check: restores a known product (favourites first) or creates a simple one */
function addToPantry(name,{quantity='',unit='',notes='',recipeId=null}={}){
  const c=canonicalIngredient(name);
  let p=PS().items.filter(x=>productKeys(x).includes(c.key)).sort((a,b)=>(b.favorite?1:0)-(a.favorite?1:0)||(a.status==='out')-(b.status==='out'))[0];
  if(p){
    if(p.status!=='have'){p.remainingAmount=null;PantryService.restorePantryItem(p.id,{quantity,unit})}
    else if(quantity){const a=productQty(p),b=qtyOf(quantity,unit);if(a&&b){const s=sumQty([a,b],c.key);if(s.length===1){const back=partToAmount({...s[0],unit:a.unit});p.remainingAmount=back.quantity}}else if(!a){p.remainingAmount=quantity;p.unit=unit}}
  }else{const raw=((parseLine(String(name))||{}).name||String(name)).replace(/\(.*?\)/g,'').trim();p=PantryService.addPantryItem({productName:raw?raw.charAt(0).toUpperCase()+raw.slice(1):displayIngredient(c.key),baseIngredient:c.key,remainingAmount:quantity||null,unit,notes})}
  if(recipeId&&!p.sourceRecipeIds.includes(recipeId))p.sourceRecipeIds.push(recipeId);
  return p;
}
function shoppingFind(key){return SL().items.find(s=>!s.checked&&canonicalIngredient(s.canonicalName).options.includes(key))}
/** addToShopping — merges by ingredient; one entry per recipe, so the same recipe never doubles up */
function addToShopping(name,{qty=null,recipeId=null,recipeName='',source='manual',offset=null}={}){
  const c=canonicalIngredient(name);let s=shoppingFind(c.key);
  if(!s){s={id:uid(),canonicalName:c.key,displayName:displayIngredient(c.key),aliases:[String(name).trim()],needs:[],manualQty:null,offset:[],checked:false,source,dateAdded:Date.now(),notes:''};SL().items.push(s)}
  if(recipeId){s.needs=s.needs.filter(n=>n.recipeId!==recipeId);s.needs.push({recipeId,recipeName,qty:qty?[qty]:[]})}
  else if(qty)s.manualQty=sumQty([...(s.manualQty||[]),qty],c.key);
  if(offset)s.offset=sumQty([...(s.offset||[]),...offset],c.key);
  return s;
}
function shoppingQty(s){
  const parts=sumQty([...s.needs.flatMap(n=>n.qty),...(s.manualQty||[])],s.canonicalName);
  return parts.map(p=>{let v=p.value;for(const o of s.offset||[]){const c=convertQty(o,p.dim,s.canonicalName);if(c)v-=c.value}return {...p,value:Math.max(0,v)}}).filter(p=>p.value>0.0001);
}
function addMissingIngredientsToShoppingList(r,check){let n=0;for(const row of check.missing){addToShopping(row.name,{qty:rowShoppingQty(row),recipeId:r.id,recipeName:r.name,source:'recipe'});n++}persist();return n}
const addMissingFromRecipe=addMissingIngredientsToShoppingList;
const createShoppingListFromRecipe=r=>addMissingIngredientsToShoppingList(r,checkRecipeAgainstPantry(r));
function planShopping(ids){
  const need={};
  for(const id of ids){const r=getR(id);if(!r)continue;
    for(const i of r.adaptedIngredients){if(!(i.name||'').trim()||i.optional)continue;const c=canonicalIngredient(i.name);if(ALWAYS_HAVE.has(c.key))continue;
      const m=matchRecipeIngredientToPantry(i,{reqs:r.userRequirements||[]});
      const k=c.key;(need[k]=need[k]||{name:i.name,c,per:[],m}).per.push({r,q:qtyOf(i.amount,i.unit)})}}
  let added=0;
  for(const k in need){
    const x=need[k], p=x.m&&(x.m.level==='exact'||x.m.level==='compatible')?x.m.product:null;
    const total=sumQty(x.per.map(e=>e.q),k);let offset=null;
    if(p){const pq=productQty(p);if(!pq)continue;
      const rem=total.map(t=>{const c=convertQty(pq,t.dim,k);return c?t.value-c.value:null});
      if(rem.some(v=>v==null)||rem.every(v=>v<=0.0001))continue;offset=[pq]}
    for(const e of x.per)addToShopping(x.name,{qty:e.q,recipeId:e.r.id,recipeName:e.r.name,source:'plan'});
    if(offset){const s=shoppingFind(k);s.offset=offset}
    added++;
  }
  persist();return added;
}

const discFind=id=>{const D=ui.disc;return D&&D.res?[...D.res.results,...(D.res.nearMisses||[])].find(r=>r.id===id):null};
function discAddMissing(x,only){
  const m=matchRecipeToPantry(x.ingredients,ui.disc.required);let n=0;
  for(const i of m.missing){if(only&&i.id!==only)continue;addToShopping(i.name,{qty:qtyOf(i.amount,i.unit),recipeId:x.id,recipeName:x.name,source:'discovery'});n++}
  persist();return n;
}
function saveDiscovered(x){
  let r=DB.recipes.find(z=>z.externalSource&&z.externalSource.key===x.id);if(r)return r;
  const O=discoveredToImport(x);O.tempText=x.tempText||'';
  r=newRecipe({name:x.name,description:x.description||'',category:guessCat(x.name),servings:x.servings||'',status:'idea',tempText:x.tempText||'',original:clone(O),originalSource:x.source&&x.source.url||'',
    adaptedIngredients:O.ingredients.map(i=>({...i,id:uid(),n:{}})),adaptedInstructions:[...O.instructions],prepTime:x.prepTime||'',cookTime:x.cookTime||'',
    sourceType:'discovered',externalSource:{...x.source,key:x.id},recipeSource:x.sourceKind==='adapted'?'adapted':x.aiSource?'ai':'existing',versionNotes:(x.subsApplied||[]).join('. '),referencePhoto:null});
  r.versions=[{id:uid(),n:1,createdAt:Date.now(),label:'Version 1',source:'manual',ingredients:clone(r.adaptedIngredients),instructions:[...r.adaptedInstructions],servings:r.servings,changes:[]}];
  DB.recipes.unshift(r);persist();return r;
}

document.addEventListener('input',e=>{
  const t=e.target, d=t.dataset;
  if(t.id==='home-q'){ui.q=t.value;$('#home-results').innerHTML=homeResults();return}
  if(t.id==='rq'){ui.rq=t.value;$('#rlist').innerHTML=recipeList();return}
  if(t.id==='have'){ui.have=t.value;return}
  if(d.pref){DB.preferences.thresholds[d.pref]=num(t.value);persistSoon();return}
  if(t.id==='ai-endpoint'){DB.preferences.aiEndpoint=t.value.trim();persistSoon();return}
  if(t.id==='pq'){ui.pq=t.value;ui.pqAI=null;const b=$('#pq-res');if(b)b.innerHTML=pantrySearchHTML();return}
  if(d.pf&&ui.pdraft){const num_=['amount','remainingAmount','drainedWeight'];let v=t.value;if(num_.includes(d.pf))v=v.trim()===''?null:v.trim();ui.pdraft[d.pf]=v;if(d.pf==='productName'&&ui.pid==='new'&&!ui.pdraft._baseTouched){ui.pdraft.baseIngredient=canonicalIngredient(v).key;const bi=$('[data-pf="baseIngredient"]');if(bi)bi.value=ui.pdraft.baseIngredient}if(d.pf==='baseIngredient')ui.pdraft._baseTouched=true;return}
  if(d.test){const r=getR(ui.id);r.testDraft[d.test]=t.value;persistSoon();return}
  if(ui.screen==='add'&&W){
    if(d.w==='text'&&looksPercentEncoded(t.value)){W.rawText=(W.rawText?W.rawText+'\n':'')+t.value;t.value=normalizeRecipeInput(t.value)}
    if(d.w){W[d.w]=t.value;saveWSoon();const b=$('#w-read');if(b)b.disabled=!wizCanRead();return}
    if(d.wf&&d.wf!=='category'){W.found[d.wf]=t.value;if(d.wf==='servings'){W.found.servingsNote='';t.classList.remove('warn')}saveWSoon();return}
    if(d.wing){const i=W.found.ingredients.find(x=>x.id===d.wing);if(i){i[d.f]=t.type==='checkbox'?t.checked:t.value;saveWSoon()}return}
    if(d.wstep!=null){W.found.instructions[+d.wstep]=t.value;saveWSoon();return}
  }
  const o=E(); if(!o)return;
  if(d.bind&&d.bind!=='category'){setPath(o,d.bind,t.value);touch();if(d.bind==='servings'||d.bind.startsWith('originalNutrition'))updNutri();return}
  if(d.ing){const i=o.adaptedIngredients.find(x=>x.id===d.ing);if(!i)return;
    if(d.n){i.n=i.n||{};
      if(i.nsrc!=='manual'&&i.nsrc!=='label'){const res=ingNut(i);i.n={};NUT.forEach(k=>{i.n[k]=res.status==='ok'?String(Math.round(res.n[k]*10)/10):''});
        $$(`[data-ing="${i.id}"][data-n]`).forEach(x=>{if(x!==t)x.value=i.n[x.dataset.n]})}
      i.n[d.n]=t.value;i.nsrc=o.nutritionStatus==='label'?'label':'manual';const p=$('#src-'+i.id);if(p){p.textContent=i.nsrc==='label'?'From label':'Entered by me';p.className='pill pref-love'}updNutri()}
    else i[d.f]=t.type==='checkbox'?t.checked:t.value;touch();return}
  if(d.stepi!=null){o.adaptedInstructions[+d.stepi]=t.value;touch();return}
  if(d.swap){const s=o.smartSwaps.find(x=>x.id===d.swap);if(s){s[d.f]=t.value;touch()}}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='file-cam'||t.id==='file-img'){onPhoto(t.files&&t.files[0]);return}
  if(t.id==='file-multi'){addWizPhotos(t.files);return}
  if(t.dataset.pfsel&&ui.pdraft){if(t.value==='__new'){t.value=ui.pdraft.category||'';ACT['pf-cat-new']();return}ui.pdraft.category=t.value;return}
  if(t.dataset.wf==='category'&&W){W.category=t.value;saveW();return}
  if(t.id==='file-json'){const f=t.files&&t.files[0];if(!f)return;const fr=new FileReader();fr.onload=()=>doImport(String(fr.result));fr.readAsText(f);return}
  if(t.id==='cat-sel'){const o=E();if(t.value==='__new'){t.value=o.category;sheetState={forRecipe:true};textSheet('New category','Category name','cat-save','e.g. Breakfast Treats');return}o.category=t.value;touch();return}
  if(t.dataset.ing&&t.dataset.f==='name')refreshTol();
  if(t.dataset.ing&&t.dataset.f==='optional'){const o=E();const i=o.adaptedIngredients.find(x=>x.id===t.dataset.ing);if(i){i.optional=t.checked;touch()}}
});
window.addEventListener('pagehide',()=>{persist();saveDraft()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){persist();saveDraft()}});

/* ============ paste: clean text at the door ============ */
document.addEventListener('paste',e=>{
  const t=e.target; if(!t||!/^(TEXTAREA|INPUT)$/.test(t.tagName)||t.type==='file')return;
  const raw=e.clipboardData&&e.clipboardData.getData('text/plain'); if(!raw)return;
  const recipe=t.dataset.clean==='recipe'||t.id==='f-paste'||/^original(Recipe|Ingredients|Instructions)$/.test(t.dataset.bind||'');
  if(recipe&&ui.screen==='add'&&W)W.rawText=(W.rawText?W.rawText+'\n':'')+raw; // raw kept, never shown
  const clean=recipe?normalizeRecipeInput(raw):safeDecodeRecipeText(raw);
  const pos=t.selectionStart??t.value.length;
  if(clean===raw&&!(recipe&&t.tagName==='TEXTAREA'&&pos>0&&t.value[pos-1]!=='\n'&&/\n/.test(raw)))return;
  e.preventDefault();
  const a=t.selectionStart??t.value.length,b=t.selectionEnd??t.value.length;
  const sep=recipe&&t.tagName==='TEXTAREA'&&a>0&&t.value[a-1]!=='\n'&&/\n/.test(clean)?'\n':'';
  t.setRangeText(sep+(t.tagName==='INPUT'?clean.replace(/\s*\n+\s*/g,' '):clean),a,b,'end');
  t.dispatchEvent(new Event('input',{bubbles:true}));
});
/* ============ init ============ */
loadDB();
W=loadW();
DB.recipes.forEach(r=>{if(r.pendingRevision&&r.pendingRevision.state==='working')r.pendingRevision={state:'error',error:'That was interrupted. Try again.',engine:r.pendingRevision.engine}});
render();
(async()=>{
  try{ui.aiReady=await SmartService.aiAvailable();ui.aiImages=ui.aiReady&&await ClaudeEngine.canReadImages();ui.maxImages=ui.aiImages?await ClaudeEngine.maxImages():0}catch(e){ui.aiReady=false}
  const a=document.activeElement;if(!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))&&['home','add','profile'].includes(ui.screen)&&!['reading','working'].includes(W&&W.stage)){const y=window.scrollY;render();window.scrollTo(0,y)}
})();

/* offline support */
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}

</script>
