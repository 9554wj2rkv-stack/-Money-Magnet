<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF0F5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Smart Treats">
<title>AJ’s Smart Treats</title>
<meta name="description" content="Turn recipes you love into recipes that work for you.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF0F5;--card:#FFFFFF;--cream:#FFE1EC;--line:#F9CFDE;
  --ink:#3A1F2B;--ink2:#7A4A5E;--choc:#4A2236;
  --rasp:#D6306E;--rasp-press:#BC2560;--rasp-ink:#B01F5A;--rasp-soft:#FFD6E5;--rasp-mid:#FF6FA0;
  --butter:#FFD25E;--butter-soft:#FFF1C9;--butter-ink:#6B4B00;
  --pista:#9ED6A8;--pista-soft:#E3F6E6;--pista-ink:#245C2F;
  --peach:#FFA9C4;--peach-soft:#FFE6EF;--peach-ink:#9A2650;
  --avoid-bg:#FBD3DC;--avoid-ink:#8E1E3E;--unk-bg:#F6E6EE;--unk-ink:#5E3A4C;
  --on-rasp:#FFFFFF;--scrim:rgba(58,31,43,.45);
  --grad:linear-gradient(135deg,#FF5C97 0%,#D6306E 100%);
  --shadow:0 1px 0 rgba(150,40,90,.05),0 10px 26px -16px rgba(170,40,100,.38);
  --shadow-lg:0 2px 0 rgba(150,40,90,.04),0 18px 40px -20px rgba(170,40,100,.45);
  --font:'Nunito',ui-rounded,'SF Pro Rounded',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  --nav-h:70px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1E1218;--card:#2B1A23;--cream:#3A2230;--line:#4D2E3E;--ink:#FFEFF5;--ink2:#E2BFD0;--choc:#FFD6E6;
    --rasp:#FF6FA0;--rasp-press:#FF8AB2;--rasp-ink:#FF9CC0;--rasp-soft:#4B1E33;--rasp-mid:#FF6FA0;--grad:linear-gradient(135deg,#FF8AB6 0%,#FF5C97 100%);
    --butter:#F4C95D;--butter-soft:#43361A;--butter-ink:#F8DC92;--pista-soft:#283A24;--pista-ink:#C4E0BB;
    --peach-soft:#46291F;--peach-ink:#F8C6B6;--avoid-bg:#4A2029;--avoid-ink:#F7B2C2;--unk-bg:#372C27;--unk-ink:#E2D3CB;
    --on-rasp:#2A1016;--scrim:rgba(0,0,0,.58);--shadow:0 1px 0 rgba(0,0,0,.25),0 10px 26px -16px rgba(0,0,0,.7);--shadow-lg:0 18px 40px -20px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --bg:#1E1218;--card:#2B1A23;--cream:#3A2230;--line:#4D2E3E;--ink:#FFEFF5;--ink2:#E2BFD0;--choc:#FFD6E6;
    --rasp:#FF6FA0;--rasp-press:#FF8AB2;--rasp-ink:#FF9CC0;--rasp-soft:#4B1E33;--rasp-mid:#FF6FA0;--grad:linear-gradient(135deg,#FF8AB6 0%,#FF5C97 100%);
  --butter:#F4C95D;--butter-soft:#43361A;--butter-ink:#F8DC92;--pista-soft:#283A24;--pista-ink:#C4E0BB;
  --peach-soft:#46291F;--peach-ink:#F8C6B6;--avoid-bg:#4A2029;--avoid-ink:#F7B2C2;--unk-bg:#372C27;--unk-ink:#E2D3CB;
  --on-rasp:#2A1016;--scrim:rgba(0,0,0,.58);--shadow:0 1px 0 rgba(0,0,0,.25),0 10px 26px -16px rgba(0,0,0,.7);--shadow-lg:0 18px 40px -20px rgba(0,0,0,.8);
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:600 17px/1.55 var(--font);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
img{max-width:100%;display:block}
svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:3px solid var(--rasp);outline-offset:2px;border-radius:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
main{max-width:640px;margin:0 auto;padding:0 20px calc(var(--nav-h) + 56px)}
main.has-foot{padding-bottom:calc(var(--nav-h) + 160px)}
h1,h2,h3,h4,p{margin:0}
h2{font:800 22px/1.25 var(--font);letter-spacing:-.01em;color:var(--choc)}
h3{font:800 18px/1.3 var(--font)}
.sub{color:var(--ink2);font-size:16.5px;font-weight:600;margin-top:4px;line-height:1.5}
section{margin-top:32px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.linkbtn{color:var(--rasp-ink);font-weight:800;font-size:16px;min-height:44px;padding:0 4px}
.muted{color:var(--ink2)}

/* ---------- hero (cake-box awning) ---------- */
.hero{margin:0 -20px;padding:0 0 4px;position:relative;background:
  radial-gradient(circle at 90% 58%,#FFD25E 0 4px,transparent 5px),radial-gradient(circle at 95% 74%,#9ED6A8 0 4px,transparent 5px),
  radial-gradient(circle at 86% 86%,#FF6FA0 0 3.5px,transparent 4.5px),radial-gradient(circle at 96% 92%,#FFD25E 0 3px,transparent 4px),
  radial-gradient(circle at 62% 22%,#9ED6A8 0 3px,transparent 4px),linear-gradient(180deg,#FFE1EC,var(--bg))}
.wordmark .aj{display:inline-block;font:900 24px/1 var(--font);color:#fff;background:var(--grad);padding:7px 14px 8px;border-radius:999px;transform:rotate(-4deg);margin-bottom:10px;letter-spacing:.02em;box-shadow:0 8px 18px -10px rgba(214,48,110,.8)}
.awning{height:46px;background:repeating-linear-gradient(90deg,var(--rasp-mid) 0 34px,#FFFFFF 34px 68px);position:relative}
.awning::after{content:"";position:absolute;left:0;right:0;bottom:-15px;height:16px;background:radial-gradient(circle at 17px 0,var(--rasp-mid) 16px,transparent 17px) 0 0/68px 16px repeat-x,radial-gradient(circle at 51px 0,#FFFFFF 16px,transparent 17px) 0 0/68px 16px repeat-x}
.hero-in{padding:40px 20px 6px}
.wordmark{font:900 50px/.95 var(--font);letter-spacing:.01em;color:var(--choc)}
.wordmark .wm{display:block}
.wordmark i{display:block}
.wordmark i{font-style:normal;color:var(--rasp)}
.hero-line{font:800 21px/1.3 var(--font);color:var(--ink);margin-top:12px}
.hero-sub{font:600 17.5px/1.5 var(--font);color:var(--ink2);margin-top:6px;max-width:30ch}
.sticker{position:absolute;right:20px;top:64px;width:88px;height:88px;border-radius:50%;background:var(--butter);color:#4A3300;display:grid;place-items:center;text-align:center;font:900 13px/1.1 var(--font);transform:rotate(9deg);box-shadow:0 8px 18px -10px rgba(107,75,0,.7);padding:8px}
.sticker::before{content:"";position:absolute;inset:5px;border-radius:50%;border:1.5px dashed rgba(74,51,0,.45)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.tile{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:16px;text-align:left;display:flex;flex-direction:column;gap:10px;min-height:104px}
.tile .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center}
.tile b{font:800 17px var(--font)}
.tile small{font:600 14.5px var(--font);color:var(--ink2)}
.ic.r{background:var(--rasp-soft);color:var(--rasp-ink)}.ic.y{background:var(--butter-soft);color:var(--butter-ink)}.ic.g{background:var(--pista-soft);color:var(--pista-ink)}.ic.p{background:var(--peach-soft);color:var(--peach-ink)}

/* ---------- page heads ---------- */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:30px 0 18px}
.page-title{font:900 34px/1.08 var(--font);letter-spacing:-.015em;color:var(--choc)}
.page-sub{font:700 17px/1.45 var(--font);color:var(--ink2);margin-top:6px}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 -20px;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.topbar .left,.topbar .right{display:flex;gap:4px;align-items:center}
.iconbtn{min-width:48px;min-height:48px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--ink);font-weight:800;font-size:16px;padding:0 10px}
.iconbtn:active{background:var(--cream)}
.topbar-title{font:800 17px var(--font);text-align:center;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- buttons ---------- */
.btn{min-height:58px;border-radius:20px;font:800 18px/1.2 var(--font);padding:0 22px;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;text-align:center;transition:transform .12s ease,background .15s}
.btn:active{transform:scale(.985)}
.btn-primary{background:var(--grad);color:var(--on-rasp);box-shadow:0 10px 22px -12px rgba(201,73,106,.8),inset 0 -3px 0 rgba(0,0,0,.08)}
.btn-primary:active{background:var(--rasp-press)}
.btn-xl{min-height:66px;font-size:20px;border-radius:22px}
.btn-hero{min-height:72px;font-size:21px;border-radius:24px;font-weight:900}
.btn-soft{background:var(--rasp-soft);color:var(--rasp-ink)}
.btn-butter{background:var(--butter);color:#3E2A00}
.btn-pista{background:var(--pista);color:#1F3A18}
.btn-ghost{border:2px solid var(--line);color:var(--ink);background:var(--card)}
.btn-danger{color:var(--avoid-ink);background:var(--avoid-bg)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn svg{width:22px;height:22px}
.row-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ---------- forms ---------- */
.field{display:block;margin-top:18px}
.field>span{display:block;font-weight:800;font-size:16px;margin-bottom:7px}
.field>small{display:block;color:var(--ink2);font-size:15px;font-weight:600;margin:-3px 0 8px}
.inp,textarea.inp,select.inp{width:100%;min-height:54px;border-radius:16px;border:2px solid var(--line);background:var(--card);font:600 17px var(--font);padding:12px 14px;outline:none;transition:border-color .15s}
textarea.inp{min-height:110px;resize:vertical;line-height:1.5}
.inp:focus{border-color:var(--rasp);box-shadow:0 0 0 4px color-mix(in srgb,var(--rasp) 16%,transparent)}
.inp.warn{border-color:var(--butter)}
select.inp{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink2) 50%),linear-gradient(135deg,var(--ink2) 50%,transparent 50%);background-position:calc(100% - 22px) 24px,calc(100% - 16px) 24px;background-size:6px 6px;background-repeat:no-repeat;padding-right:40px}
.search{position:relative}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--ink2)}
.search input{width:100%;min-height:56px;border-radius:18px;border:2px solid var(--line);background:var(--card);padding:0 16px 0 50px;font:600 17px var(--font);outline:none}
.search input:focus{border-color:var(--rasp)}
.search input::-webkit-search-cancel-button{-webkit-appearance:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

/* ---------- cards ---------- */
.card{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:20px}
.stack>*+*{margin-top:12px}

/* ---------- chips ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:4px 20px 6px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{min-height:46px;padding:0 16px;border-radius:999px;border:2px solid var(--line);background:var(--card);font:700 16px var(--font);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.chip.on{background:var(--choc);border-color:var(--choc);color:#fff}
.chip.req.on{background:var(--rasp);border-color:var(--rasp);color:var(--on-rasp)}
.chip.goal.on{background:var(--butter);border-color:var(--butter);color:#3E2A00}
.chip svg{width:18px;height:18px}
.chip.add{border-style:dashed;color:var(--rasp-ink)}

/* ---------- pills ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;font:800 13.5px/1 var(--font);padding:7px 11px;border-radius:999px;white-space:nowrap}
.pill svg{width:14px;height:14px;stroke-width:3}
.st-idea{background:var(--unk-bg);color:var(--unk-ink)}
.st-adapted{background:var(--peach-soft);color:var(--peach-ink)}
.st-ready,.st-tested{background:var(--butter-soft);color:var(--butter-ink)}
.st-approved{background:var(--pista-soft);color:var(--pista-ink)}
.badge{font:800 13px/1 var(--font);padding:7px 10px;border-radius:10px;background:var(--cream);color:var(--choc)}
.badge.y{background:var(--butter-soft);color:var(--butter-ink)}
.badges{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tol-good{background:var(--pista-soft);color:var(--pista-ink)}
.tol-caution{background:var(--butter-soft);color:var(--butter-ink)}
.tol-avoid{background:var(--avoid-bg);color:var(--avoid-ink)}
.tol-unknown{background:var(--unk-bg);color:var(--unk-ink)}
.pref-love{background:var(--rasp-soft);color:var(--rasp-ink)}
.pref-dislike{background:var(--cream);color:var(--choc)}
.conf-high{background:var(--pista-soft);color:var(--pista-ink)}
.conf-medium{background:var(--butter-soft);color:var(--butter-ink)}
.conf-experimental{background:var(--peach-soft);color:var(--peach-ink)}

/* ---------- recipe cards ---------- */
.rcard{background:var(--card);border-radius:24px;box-shadow:var(--shadow);overflow:hidden;cursor:pointer;transition:transform .16s ease,box-shadow .16s ease;position:relative;text-align:left}
.rcard:active{transform:translateY(-2px) scale(.995);box-shadow:var(--shadow-lg)}
.thumb{position:relative;overflow:hidden;background:var(--cream)}
.thumb>img,.thumb>svg{width:100%;height:100%;object-fit:cover;display:block;stroke:none}
.rcard h3{font:800 19px/1.22 var(--font);color:var(--choc)}
.kcal{font:900 19px/1.2 var(--font);margin-top:6px}
.kcal small{font-weight:700;font-size:14px;color:var(--ink2)}
.macros{font-size:15px;color:var(--ink2);margin-top:2px;line-height:1.4;font-weight:700}
.heart{position:absolute;top:10px;right:10px;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.96);display:grid;place-items:center;color:var(--rasp);box-shadow:0 4px 12px -6px rgba(0,0,0,.3)}
.heart svg{width:24px;height:24px;stroke-width:2.2}
.heart.on svg{fill:currentColor}
.heart.pop svg{animation:pop .38s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.rlist{display:grid;gap:14px}
.rcard.l{display:grid;grid-template-columns:118px 1fr;gap:14px;padding:12px;align-items:center}
.rcard.l .thumb{aspect-ratio:1;border-radius:18px}
.rcard.l .heart{top:auto;bottom:6px;left:6px;right:auto;width:40px;height:40px}
.rcard.l .heart svg{width:21px;height:21px}
.rcard.l .badges{margin-top:9px}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rcard.g .thumb{aspect-ratio:1}
.rcard.g .rbody{padding:12px 13px 15px}
.rcard.g h3{font-size:17px}
.rcard.g .badges{margin-top:9px}
.hscroll{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -20px;padding:4px 20px 18px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.rcard.h{flex:0 0 252px;scroll-snap-align:start}
.rcard.h .thumb{aspect-ratio:4/3}
.rcard.h .rbody{padding:14px 16px 16px}
.rcard.h .badges{margin-top:10px}
.cat-line{font-size:14.5px;color:var(--ink2);margin-bottom:2px;display:flex;gap:8px;align-items:center;font-weight:700}
.stars-sm{display:inline-flex;gap:1px;color:var(--rasp)}
.stars-sm svg{width:15px;height:15px;stroke-width:2.2}
.stars-sm .on{fill:currentColor}

/* ---------- empty / continue ---------- */
.empty{border:2px dashed var(--line);border-radius:24px;padding:24px 20px;text-align:center}
.empty p{font:800 18px/1.4 var(--font);color:var(--choc)}
.empty small{display:block;color:var(--ink2);font-size:15.5px;margin-top:6px;font-weight:600}
.empty .btn{margin-top:16px}
.continue{display:flex;align-items:center;gap:14px;padding:16px 18px;margin-top:12px;border-radius:22px;background:var(--butter-soft);color:var(--ink);width:100%;text-align:left}
.continue b{display:block;font-size:17px;font-weight:800}
.continue span{font-size:15px;color:var(--ink2)}
.continue .dot{width:46px;height:46px;border-radius:50%;background:var(--card);display:grid;place-items:center;color:var(--butter-ink);flex:none}

/* ---------- what do I have ---------- */
.have textarea{margin-top:14px}
.have .btn{margin-top:12px}
.hres{display:flex;gap:12px;align-items:center;padding:14px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.hres:first-child{border-top:0}
.hres .mini{width:58px;height:58px;border-radius:14px;overflow:hidden;flex:none}
.hres .mini svg,.hres .mini img{width:100%;height:100%;object-fit:cover;stroke:none}
.hres b{display:block;font-size:17px;font-weight:800}
.hres .have-line{font-size:15.5px}
.hres .need{font-size:14.5px;color:var(--ink2)}
.meter{height:7px;border-radius:7px;background:var(--cream);margin-top:6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--pista);border-radius:7px}

/* ---------- tabbar ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--card) 95%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink2);font:800 13px/1.1 var(--font);text-align:center}
.tab svg{width:25px;height:25px}
.tab.on{color:var(--rasp-ink)}
.tab.on svg{stroke-width:2.5}
.tab-add .plus{width:64px;height:64px;border-radius:50%;background:var(--grad);color:var(--on-rasp);display:grid;place-items:center;margin-top:-32px;box-shadow:0 10px 22px -8px rgba(201,73,106,.8),0 0 0 6px var(--bg)}
.tab-add .plus svg{width:30px;height:30px;stroke-width:2.8}
.tab-add span:last-child{color:var(--rasp-ink)}

/* ---------- sticky footer ---------- */
.footbar{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));z-index:30;padding:14px 20px 12px;background:linear-gradient(to bottom,transparent,var(--bg) 26%)}
.footbar-in{max-width:600px;margin:0 auto;display:flex;gap:10px}
.footbar-in .btn-ghost.sq{flex:0 0 auto;width:auto}
.footbar .btn{padding:0 14px;font-size:17.5px}

/* ---------- wizard ---------- */
.wiz-steps{display:flex;gap:6px;margin:6px 0 18px}
.wiz-steps i{flex:1;height:6px;border-radius:6px;background:var(--line)}
.wiz-steps i.on{background:var(--rasp)}
.wiz-steps i.done{background:var(--pista)}
.wtitle{font:900 30px/1.12 var(--font);letter-spacing:-.01em;color:var(--choc)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.opt{min-height:120px;border-radius:22px;background:var(--card);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:16px;font:800 17px/1.25 var(--font);text-align:left;border:2.5px solid transparent}
.opt .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center}
.opt .ic svg{width:26px;height:26px}
.opt.on{border-color:var(--rasp)}
.opt small{display:block;font:600 14px var(--font);color:var(--ink2);margin-top:2px}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.thumbs div{position:relative;aspect-ratio:3/4;border-radius:14px;overflow:hidden;background:var(--cream)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.thumbs button{position:absolute;top:6px;right:6px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.95);display:grid;place-items:center;color:#342925}
.thumbs button svg{width:18px;height:18px}
.engine{display:inline-flex;align-items:center;gap:8px;font:800 14px var(--font);padding:8px 12px;border-radius:999px;margin-top:12px}
.engine.ai{background:var(--butter-soft);color:var(--butter-ink)}
.engine.rules{background:var(--cream);color:var(--choc)}
.engine svg{width:17px;height:17px}
.note{background:var(--cream);border-radius:18px;padding:14px 16px;font-size:16px;line-height:1.5;margin-top:14px;font-weight:600}
.note.y{background:var(--butter-soft);color:var(--ink)}
.note.r{background:var(--rasp-soft)}
.note.g{background:var(--pista-soft)}
.note b{font-weight:800}
.photo-box{margin-top:12px;border-radius:18px;overflow:hidden;position:relative;background:var(--cream)}
.photo-box img{width:100%;max-height:340px;object-fit:contain;background:var(--cream)}
.found-meta{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.found-meta .field{margin-top:12px}
.rank{display:grid;gap:8px;margin-top:12px}
.rank-row{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:10px 10px 10px 14px}
.rank-row .n{font:900 18px var(--font);color:var(--ink2)}
.rank-row b{font-weight:800;font-size:16.5px;display:block}
.rank-row .lvl{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.rank-row .lvl button{min-height:36px;padding:0 12px;border-radius:999px;font:800 13.5px var(--font);border:2px solid var(--line);background:var(--card)}
.rank-row .lvl button.on{background:var(--choc);color:var(--bg);border-color:var(--choc)}
.rank-row .mv{display:flex;flex-direction:column;gap:4px}
.rank-row .mv button{width:44px;height:40px;border-radius:12px;background:var(--cream);display:grid;place-items:center}
.rank-row .mv button[disabled]{opacity:.35}
.lock{font:800 13px var(--font);background:var(--rasp-soft);color:var(--rasp-ink);padding:6px 10px;border-radius:999px;display:inline-block;margin-top:6px}
.working{text-align:center;padding:40px 10px}
.whisker{width:92px;height:92px;border-radius:50%;background:var(--butter-soft);display:grid;place-items:center;margin:0 auto 22px;color:var(--butter-ink)}
.whisker svg{width:48px;height:48px;animation:whisk 1.1s ease-in-out infinite;transform-origin:50% 90%}
@keyframes whisk{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
.wsteps{display:grid;gap:10px;margin:22px auto 0;max-width:340px;text-align:left}
.wsteps div{display:flex;gap:10px;align-items:center;font-weight:700;color:var(--ink2)}
.wsteps div.on{color:var(--ink)}
.wsteps div i{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.wsteps div.on i{background:var(--pista);border-color:var(--pista);color:#1F3A18}
.wsteps i svg{width:14px;height:14px;stroke-width:3.2}
.stream{margin-top:18px;font:600 13px/1.4 ui-monospace,Menlo,monospace;color:var(--ink2);max-height:90px;overflow:hidden;text-align:left;background:var(--cream);border-radius:14px;padding:10px 12px;white-space:pre-wrap;word-break:break-word}

/* ---------- import ---------- */
.shotcard{margin-top:20px;border-radius:26px;background:var(--rasp-soft);padding:20px 18px 18px;border:2.5px solid transparent}
.shotcard.on{border-color:var(--rasp)}
.shotcard .ic{width:52px;height:52px;border-radius:16px;background:var(--card);color:var(--rasp-ink);display:grid;place-items:center}
.shotcard .ic svg{width:28px;height:28px}
.shotcard h2{margin-top:14px;font-size:21px}
.shotcard p{margin:6px 0 16px;font-weight:600;color:var(--ink);font-size:16.5px}
.opts.three{grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.opts.three .opt{min-height:118px;padding:13px;font-size:15.5px}
.opts.three .opt .ic{width:40px;height:40px}
.opts.three .opt small{font-size:13px}
.thumbs .tnum{position:absolute;left:6px;bottom:6px;min-width:28px;height:28px;border-radius:999px;background:var(--choc);color:#FFF8F0;font:900 14px/28px var(--font);text-align:center}
.found-title{display:flex;align-items:center;gap:10px}
.found-title svg{width:30px;height:30px;color:var(--butter-ink)}
.flist{list-style:none;margin:10px 0 0;padding:0;font-size:18px;line-height:1.5}
.flist li{padding:10px 2px;border-bottom:1px solid var(--line);font-weight:600}
.flist li b{font-weight:900}
.flist.num{counter-reset:s}
.flist.num li{counter-increment:s;display:grid;grid-template-columns:36px 1fr}
.flist.num li::before{content:counter(s);font:900 20px var(--font);color:var(--rasp)}
.servrow{display:flex;align-items:center;gap:10px;margin-top:10px}
.servrow .inp{max-width:120px;text-align:center;font-size:19px;font-weight:800}
.servrow span{font-weight:800}
/* ---------- needs: tiers, texture, strength ---------- */
.tierhead{display:flex;flex-direction:column;gap:6px}
.tier{align-self:flex-start;font:900 12.5px/1 var(--font);letter-spacing:.08em;text-transform:uppercase;padding:7px 10px;border-radius:999px}
.tier.must{background:var(--rasp);color:var(--on-rasp)}
.tier.nice{background:var(--butter);color:#3E2A00}
.chip.tex.on{background:var(--peach);border-color:var(--peach);color:#4A1F12}
.strength{display:grid;gap:10px}
.strength button{text-align:left;padding:14px 16px;border-radius:18px;border:2.5px solid var(--line);background:var(--card)}
.strength button b{display:block;font:900 17.5px var(--font)}
.strength button small{display:block;font:600 15px var(--font);color:var(--ink2);margin-top:2px}
.strength button.on{border-color:var(--rasp);background:var(--rasp-soft)}
.perfect{display:inline-flex;align-items:center;gap:6px;background:var(--choc);color:#FFF8F0;font:900 13.5px/1 var(--font);letter-spacing:.04em;text-transform:uppercase;padding:9px 12px;border-radius:999px}
.perfect svg{width:15px;height:15px;fill:var(--butter);stroke:var(--butter)}
.perfect.sm{font-size:11.5px;padding:6px 9px;margin-top:6px}
.btn-rescue{background:var(--peach-soft);color:var(--peach-ink);border:2px dashed var(--peach)}
/* ---------- pantry ---------- */
.pantry-card{margin-top:14px;background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:16px}
.pantry-card .pc-top{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.pantry-card .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none}
.pantry-card b{display:block;font:900 18px var(--font);color:var(--choc)}
.pantry-card small{display:block;font:700 15px var(--font);color:var(--ink2)}
.plist{display:grid;gap:8px}
.prow{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:10px 12px;width:100%;text-align:left}
.prow.out,.prow.done{opacity:.75}
.prow.done b{text-decoration:line-through}
.pcheck{width:40px;height:40px;border-radius:50%;border:2.5px solid var(--line);display:grid;place-items:center;flex:none;font:900 19px var(--font);color:var(--ink2);background:var(--card)}
.pcheck.on{background:var(--pista);border-color:var(--pista);color:#1F3A18}
.pcheck.sl{border-radius:12px}
.pname{flex:1;min-width:0;text-align:left;display:block}
.pname b{display:block;font:800 17.5px var(--font)}
.pname small{display:block;font:600 14.5px var(--font);color:var(--ink2);margin-top:2px}
.pord{display:flex;gap:4px}
.pord button,.delx{width:38px;height:40px;border-radius:12px;background:var(--cream);display:grid;place-items:center;color:var(--ink2)}
.pord button svg,.delx svg{width:18px;height:18px}
.pord button[disabled]{opacity:.35}
.mini-btn{min-height:38px;padding:0 12px;border-radius:999px;border:2px solid var(--line);background:var(--card);font:800 14px var(--font);white-space:nowrap;color:var(--ink)}
.small{font-size:14px;font-weight:700}
.ptitle{margin:22px 0 10px;font:900 15px var(--font);color:var(--ink2);text-transform:uppercase;letter-spacing:.06em}
.sres{margin-top:10px;padding:6px 14px}
.srow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.srow:first-child{border-top:0}
.srow-n{display:flex;align-items:center;gap:10px;font-size:17px}
.srow-b{display:flex;gap:6px;align-items:center}
.pst{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;font:900 16px var(--font);flex:none}
.pst.have{background:var(--pista);color:#1F3A18}
.pst.need{border:2.5px solid var(--peach);color:var(--peach-ink);background:var(--card)}
.pst.inbtn{width:26px;height:26px}
.crow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px;border-radius:18px;background:var(--card);box-shadow:var(--shadow)}
.crow.need,.crow.partial{background:var(--peach-soft)}
.csum{margin-top:16px;display:flex;flex-direction:column;gap:4px}
.csum b{font:900 22px var(--font);color:var(--choc)}
.csum span{font:800 17px var(--font);color:var(--peach-ink)}
.addrow{display:flex;gap:8px}
.addrow .inp{flex:1}
.planrow.sel{outline:2.5px solid var(--rasp)}
/* ---------- pantry products ---------- */
.pcard{display:grid;grid-template-columns:58px 1fr auto;gap:12px;align-items:center;background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:10px 12px}
.pcard.out{opacity:.8}
.pthumb{width:58px;height:58px;border-radius:16px;background:var(--cream);display:grid;place-items:center;overflow:hidden;font-size:28px}
.pthumb img{width:100%;height:100%;object-fit:cover}
.pthumb.big{width:120px;height:120px;font-size:15px;color:var(--rasp-ink);gap:4px;align-content:center}
.pthumb.big svg{width:34px;height:34px}
.pinfo{text-align:left;min-width:0}
.pinfo b{display:block;font:800 17px/1.25 var(--font)}
.pinfo .brand{display:block;font:700 14px var(--font);color:var(--ink2)}
.pmeta{display:flex;gap:6px;align-items:center;margin-top:5px;flex-wrap:wrap}
.pmeta small{font:700 13.5px var(--font);color:var(--ink2)}
.pside{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.loc{font:900 11.5px/1 var(--font);letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;border-radius:999px}
.loc-fridge{background:#DDEBFF;color:#1F4F8F}.loc-pantry{background:var(--butter-soft);color:var(--butter-ink)}.loc-freezer{background:#E2F4F8;color:#155E6E}
.spill{min-height:34px;padding:0 12px;border-radius:999px;font:900 13px var(--font)}
.spill.st-have{background:var(--pista-soft);color:var(--pista-ink)}.spill.st-low{background:var(--butter-soft);color:var(--butter-ink)}.spill.st-out{background:var(--avoid-bg);color:var(--avoid-ink)}
.heart-s{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--rasp)}
.heart-s svg{width:20px;height:20px}
.heart-s.on svg{fill:currentColor}
.pphoto{margin-top:12px;display:flex;flex-direction:column;align-items:center;gap:8px}
.pphoto img{max-width:100%;max-height:260px;border-radius:20px;object-fit:contain;background:var(--cream)}
.attrs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.attr{border-radius:16px;padding:10px 12px;text-align:left;border:2px solid var(--line);background:var(--card)}
.attr b{display:block;font:800 15px var(--font)}
.attr small{display:block;font:800 13px var(--font);color:var(--ink2)}
.attr.a-yes{background:var(--pista-soft);border-color:var(--pista)}.attr.a-yes small{color:var(--pista-ink)}
.attr.a-no{background:var(--cream)}
.cclist{list-style:none;margin:0 14px;padding:10px 12px;border-radius:16px;background:var(--cream);display:grid;gap:4px;font:700 15.5px var(--font)}
.cclist li.ok{color:var(--pista-ink)}.cclist li.no{color:var(--avoid-ink)}.cclist small{font-weight:600;color:var(--ink2)}
.ccsum{margin:10px 14px 0;font:900 16px var(--font);color:var(--choc)}
.pst.no{background:var(--avoid-bg);color:var(--avoid-ink)}
.usepantry{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:14px;border-radius:18px;border:2.5px solid var(--line);background:var(--card)}
.usepantry.on{border-color:var(--rasp);background:var(--rasp-soft)}
.usepantry b{display:block;font:900 17px var(--font)}
.usepantry small{display:block;font:600 15px var(--font);color:var(--ink2);margin-top:3px}
.yi{display:grid;gap:8px;margin-top:10px}
.yi-row{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:16px;background:var(--pista-soft)}
.yi-row.need{background:var(--peach-soft)}
.yi-row b{display:block;font:800 16.5px var(--font)}
.yi-row small{display:block;font:900 12.5px var(--font);letter-spacing:.04em;color:var(--ink2);margin-top:3px}
.crow em{font-style:normal;color:var(--ink2)}
.seg.mini button{min-height:40px;font-size:14px}
/* ---------- discovery ---------- */
.havecount{display:flex;gap:14px;align-items:center;margin-top:16px;background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:14px 16px}
.havecount b{font:900 34px/1 var(--font);color:var(--rasp)}
.havecount span{font:700 16px/1.4 var(--font)}
.moods{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.mood{display:flex;align-items:center;gap:10px;min-height:56px;padding:0 14px;border-radius:18px;border:2.5px solid var(--line);background:var(--card);font:800 16px var(--font);text-align:left}
.mood span{font-size:22px}
.mood.on{border-color:var(--rasp);background:var(--rasp-soft);color:var(--rasp-ink)}
.dcard{background:var(--card);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}
.dimg{position:relative;display:grid;place-items:center;width:100%;aspect-ratio:16/9;background:var(--cream);font-size:56px;overflow:hidden}
.dimg img{width:100%;height:100%;object-fit:cover}
.match{position:absolute;left:12px;bottom:12px;font:900 13.5px var(--font);letter-spacing:.03em;text-transform:uppercase;padding:8px 12px;border-radius:999px;background:#fff;color:var(--ink)}
.match.hi{background:#2F8F46;color:#fff}.match.mid{background:var(--butter);color:#3E2A00}.match.lo{background:#fff;color:var(--ink2)}
.dbody{padding:14px 16px 16px}
.dbody h3{font:900 21px/1.2 var(--font);color:var(--choc);margin-top:4px}
.dsrc{font:800 13.5px var(--font);color:var(--ink2)}
.dsrc a{color:var(--rasp-ink)}
.hv{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.hv small{display:block;font:900 12px var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin-bottom:4px}
.hv span{display:block;font:700 15px/1.4 var(--font)}
.hv .ok{color:#256B36}.hv .no{color:var(--avoid-ink)}
.hv em{font-style:normal;font-weight:600;color:var(--ink2)}
.why2{margin-top:10px;font:600 15px/1.45 var(--font);color:var(--ink2)}
.badge.warnb{background:var(--butter-soft);color:var(--butter-ink)}
.dhero{margin:0 -20px;aspect-ratio:16/10;max-height:340px;background:var(--cream);display:grid;place-items:center;font-size:72px;overflow:hidden}
.dhero img{width:100%;height:100%;object-fit:cover}
.loc-staple{background:var(--pista-soft);color:var(--pista-ink)}
/* ---------- discovery v2 ---------- */
.sbadge{display:inline-block;font:900 11.5px/1 var(--font);letter-spacing:.05em;text-transform:uppercase;padding:6px 9px;border-radius:999px;background:var(--cream);color:var(--choc);margin-right:4px;vertical-align:1px}
.sbadge.st{background:var(--rasp-soft);color:var(--rasp-ink)}.sbadge.web{background:#DDEBFF;color:#1F4F8F}.sbadge.mine{background:var(--butter-soft);color:var(--butter-ink)}
.subs{margin-top:8px;font:700 14.5px/1.45 var(--font);color:var(--rasp-ink)}
.match-inline{font:900 13px var(--font);text-transform:uppercase;letter-spacing:.03em;padding:8px 12px;border-radius:999px}
.match-inline.hi{background:#2F8F46;color:#fff}.match-inline.mid{background:var(--butter);color:#3E2A00}
.loc-soon{background:var(--peach-soft);color:var(--peach-ink)}
/* ---------- smart recipe ai ---------- */
.xofy{margin-top:6px;font:800 15px var(--font);color:#256B36}
.xofy b{color:var(--avoid-ink)}
.miss-acts{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.fb{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.fb button{min-height:64px;border-radius:18px;border:2.5px solid var(--line);background:var(--card);font:800 14.5px var(--font);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.fb button span{font-size:20px;color:var(--rasp)}
.fb button.on{border-color:var(--rasp);background:var(--rasp-soft)}
.seg.wrap5{grid-auto-flow:row;grid-template-columns:repeat(3,1fr)}
/* ---------- servings / yield ---------- */
.yieldcard .ycol{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.yieldcard .ycol small{font:900 12.5px var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);min-width:96px}
.yieldcard .ycol b{font:900 18px var(--font);color:var(--choc)}
.nmiss{display:block;width:100%;text-align:left;margin-top:10px;padding:12px 14px;border-radius:16px;background:var(--butter-soft);color:var(--butter-ink);font:800 15px var(--font)}
/* ---------- results ---------- */
.ready-badge{display:inline-flex;align-items:center;gap:8px;background:var(--rasp-soft);color:var(--rasp-ink);font:900 15px var(--font);padding:8px 14px;border-radius:999px}
.ready-badge svg{width:18px;height:18px;stroke-width:3}
.rname{font:900 32px/1.1 var(--font);color:var(--choc);margin-top:14px;letter-spacing:-.01em}
.ba{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-top:18px}
.ba .side{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:16px;text-align:center}
.ba .side.mine{background:var(--rasp-soft)}
.ba .side small{display:block;font:800 13.5px var(--font);color:var(--ink2)}
.ba .side b{display:block;font:900 32px/1.1 var(--font);color:var(--choc);margin-top:4px}
.ba .side span{font:700 14px var(--font);color:var(--ink2)}
.ba .arrow{color:var(--rasp)}
.delta{text-align:center;margin-top:10px;font:900 18px var(--font);color:var(--pista-ink)}
.delta.up{color:var(--peach-ink)}
.gl{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.gl:first-child{border-top:0}
.gl .ok{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:900 16px var(--font)}
.gl .ok svg{width:18px;height:18px;stroke-width:3.2}
.gl b{font-weight:800;display:block}
.gl small{display:block;font-size:15px;color:var(--ink2);font-weight:600}
.s-met{background:var(--pista-soft);color:var(--pista-ink)}.s-not_met{background:var(--avoid-bg);color:var(--avoid-ink)}.s-cannot_confirm,.s-unknown{background:var(--butter-soft);color:var(--butter-ink)}
.chg{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:16px 18px}
.chg-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.chg-top h4{margin:0;font:900 17px var(--font);color:var(--choc)}
.chg .row{display:grid;grid-template-columns:92px 1fr;gap:8px;margin-top:10px;font-size:16px}
.chg .row small{font:800 13.5px var(--font);color:var(--ink2);padding-top:2px}
.chg .row.new span{font-weight:800;color:var(--rasp-ink)}
.chg .why{margin-top:10px;font-size:16px;font-weight:600}
.chg .rel{margin-top:8px;font-size:15px;color:var(--ink2);font-weight:600}
.meta3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.meta3 div{background:var(--cream);border-radius:16px;padding:12px;text-align:center}
.meta3 small{display:block;font:800 13px var(--font);color:var(--ink2)}
.meta3 b{display:block;font:900 16px/1.25 var(--font);margin-top:2px}
.ntable{width:100%;border-collapse:collapse;margin-top:8px;font-size:16px}
.ntable th,.ntable td{text-align:right;padding:10px 4px;border-top:1px solid var(--line)}
.ntable th{font-size:13.5px;color:var(--ink2);font-weight:800;border-top:0}
.ntable td:first-child,.ntable th:first-child{text-align:left}
.ntable td b{font-weight:900}
.miss{display:flex;gap:8px;align-items:center;font-size:15px;color:var(--butter-ink);font-weight:700}

/* ---------- tolerance ---------- */
.tolrow{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;padding:13px 0;border-top:1px solid var(--line)}
.tolrow:first-child{border-top:0}
.tolrow b{font-weight:800;font-size:17px;display:block}
.tolrow small{display:block;color:var(--ink2);font-size:14.5px;margin-top:2px;font-weight:600}
.tolrow .pills{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.banner{border-radius:16px;padding:13px 15px;font-size:16px;font-weight:700;margin-bottom:10px}

/* ---------- recipe view ---------- */
.rhero{margin:0 -20px;position:relative;aspect-ratio:4/3;max-height:420px;overflow:hidden;background:var(--cream)}
.rhero>img,.rhero>svg{width:100%;height:100%;object-fit:cover;stroke:none}
.rhero .addphoto{position:absolute;left:16px;bottom:16px;min-height:44px;padding:0 14px;border-radius:999px;background:rgba(255,255,255,.95);color:#342925;font-weight:800;font-size:15px;display:flex;align-items:center;gap:8px}
.rhero .addphoto svg{width:20px;height:20px}
.rhead{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;margin-top:22px}
.rtitle{font:900 31px/1.1 var(--font);letter-spacing:-.012em;color:var(--choc)}
.rhead .heart{position:static;flex:none;background:var(--rasp-soft);box-shadow:none;width:52px;height:52px}
.rdesc{font-size:18px;line-height:1.55;margin-top:10px;font-weight:600}
.track{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;list-style:none;padding:0;margin:18px 0 0}
.track li{display:flex;flex-direction:column;align-items:center;gap:6px;font:800 12.5px/1.15 var(--font);color:var(--ink2);text-align:center;position:relative}
.track li::before{content:"";position:absolute;top:8px;left:-50%;width:100%;height:3px;background:var(--line);z-index:0}
.track li:first-child::before{display:none}
.track li i{position:relative;width:19px;height:19px;border-radius:50%;background:var(--card);border:3px solid var(--line);z-index:1}
.track li.past i{background:var(--pista);border-color:var(--pista)}
.track li.past::before,.track li.cur::before{background:var(--pista)}
.track li.cur i{background:var(--rasp);border-color:var(--rasp);box-shadow:0 0 0 4px var(--rasp-soft)}
.track li.cur{color:var(--rasp-ink)}
.nsum{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:20px}
.nsum .big{font:900 34px/1 var(--font);letter-spacing:-.01em;color:var(--choc)}
.nsum .big small{font-size:16px;font-weight:800;color:var(--ink2)}
.nsum .macros{font-size:16.5px;color:var(--ink);margin-top:8px}
.servings{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stepper{display:flex;align-items:center;gap:6px;background:var(--cream);border-radius:18px;padding:5px}
.stepper button{width:50px;height:50px;border-radius:14px;background:var(--card);display:grid;place-items:center;font-size:24px;font-weight:800;box-shadow:var(--shadow)}
.stepper output{min-width:46px;text-align:center;font:900 22px var(--font)}
.scale-note{font-size:15px;color:var(--ink2);margin-top:10px}
.grp{font:900 15px/1.3 var(--font);color:var(--rasp-ink);margin:18px 0 2px;letter-spacing:.01em}
.chk{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;padding:13px 2px;min-height:58px;border-bottom:1px solid var(--line);font-size:18.5px;line-height:1.45;font-weight:600}
.chk .box{width:30px;height:30px;border-radius:10px;border:2.5px solid var(--rasp);flex:none;display:grid;place-items:center;margin-top:-1px;color:var(--on-rasp);transition:background .15s}
.chk .box svg{width:20px;height:20px;stroke-width:3.2;opacity:0}
.chk.done .box{background:var(--rasp)}
.chk.done .box svg{opacity:1}
.chk.done .t{opacity:.5;text-decoration:line-through;text-decoration-thickness:1.5px}
.chk .amt{font-weight:900}
.chk .opt{color:var(--ink2);font-size:15.5px}
.mstep{display:grid;grid-template-columns:56px 1fr;gap:6px;width:100%;text-align:left;padding:16px 2px;border-bottom:1px solid var(--line)}
.mstep .num{font:900 26px/1.15 var(--font);color:var(--rasp)}
.mstep .num svg{width:30px;height:30px;stroke-width:3;color:var(--pista-ink)}
.mstep .t{font-size:19px;line-height:1.62;font-weight:600}
.mstep.done .t{opacity:.5}
details.fold{background:var(--card);border-radius:22px;box-shadow:var(--shadow);margin-top:12px;overflow:hidden}
details.fold>summary{list-style:none;min-height:62px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;font:800 18px var(--font);cursor:pointer}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary svg{transition:transform .2s;color:var(--ink2)}
details.fold[open]>summary svg{transform:rotate(180deg)}
details.fold>summary small{font-weight:700;color:var(--ink2);font-size:15px;margin-left:auto}
.fold-body{padding:0 18px 20px}
.kv{display:grid;gap:4px;margin-top:12px}
.kv b{font-size:14px;color:var(--ink2);font-weight:800}
.pre{white-space:pre-wrap;font-size:16.5px;line-height:1.55}
.test{border-top:1px solid var(--line);padding:14px 0}
.test:first-child{border-top:0}
.test h4{margin:0;font-size:17px;font-weight:800}
.test .facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.test p{margin-top:8px;font-size:16px}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vs>div{background:var(--cream);border-radius:16px;padding:12px}
.vs>div.mine{background:var(--rasp-soft)}
.vs h4{margin:0 0 6px;font:900 14px var(--font);color:var(--ink2)}
.vs ul{margin:0;padding:0;list-style:none;font-size:15px;line-height:1.45}
.vs li+li{margin-top:5px}
.ver{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.ver:first-child{border-top:0}
.ver b{display:block;font-weight:800}
.ver small{color:var(--ink2);font-size:14.5px}

/* ---------- editor (manual) ---------- */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0 22px}
.stepb{display:flex;flex-direction:column;align-items:center;gap:6px;font:800 13px/1.15 var(--font);color:var(--ink2);text-align:center;padding:4px 0}
.stepb i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:15px;border:2px solid var(--line);background:var(--card)}
.stepb.done i{background:var(--pista-soft);border-color:var(--pista-soft);color:var(--pista-ink)}
.stepb.on{color:var(--rasp-ink)}
.stepb.on i{background:var(--rasp);border-color:var(--rasp);color:var(--on-rasp)}
.stepb[disabled]{opacity:.45}
.stepb i svg{width:17px;height:17px;stroke-width:3}
.ed-title{font:900 30px/1.12 var(--font);letter-spacing:-.01em;color:var(--choc)}
.sources{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.src{min-height:112px;border-radius:22px;background:var(--card);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:16px;font:800 17px/1.25 var(--font);text-align:left;border:2.5px solid transparent}
.src svg{width:30px;height:30px;color:var(--rasp)}
.src.on{border-color:var(--rasp);background:var(--rasp-soft)}
.src.wide{grid-column:1/-1;min-height:76px;flex-direction:row;align-items:center;justify-content:flex-start;gap:14px}
.mine-div{display:flex;flex-direction:column;align-items:center;gap:2px;margin:24px 0 6px;color:var(--rasp-ink);font:900 18px var(--font)}
.mine-div svg{width:22px;height:22px}
.ingrow{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:12px;display:grid;gap:8px}
.ingrow .top{display:grid;grid-template-columns:1fr 1fr 50px;gap:8px}
.ingrow .inp{min-height:50px;padding:10px 12px}
.ingrow .meta{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.optlab{display:flex;gap:8px;align-items:center;font-size:15.5px;min-height:48px;padding:0 6px;color:var(--ink2)}
.optlab input{width:22px;height:22px;accent-color:var(--rasp)}
.delbtn{min-height:50px;border-radius:14px;display:grid;place-items:center;color:var(--ink2);background:var(--cream)}
.steprow{display:grid;grid-template-columns:38px 1fr;gap:10px;align-items:start}
.steprow .n{font:900 22px/50px var(--font);color:var(--rasp-ink);text-align:center}
.steprow textarea{min-height:80px}
.steprow .tools{display:flex;gap:6px;margin-top:6px}
.steprow .tools button{min-height:40px;min-width:44px;border-radius:12px;background:var(--cream);color:var(--ink2);display:grid;place-items:center}
.steprow .tools svg{width:20px;height:20px}
.swap{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:16px}
.swap .arrow{display:flex;justify-content:center;color:var(--rasp);margin:4px 0}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.seg.wrap{grid-auto-flow:row;grid-template-columns:1fr 1fr}
.seg button{min-height:54px;border-radius:16px;border:2px solid var(--line);background:var(--card);font:800 16px/1.2 var(--font);padding:6px 8px}
.seg button.on{background:var(--rasp-soft);border-color:var(--rasp);color:var(--rasp-ink)}
.nut-ing{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:14px}
.nut-ing h4{margin:0 0 4px;font-size:17px;font-weight:800}
.nut-ing h4 small{font-weight:600;color:var(--ink2)}
.nut-ing .srcrow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.nut-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.nut-grid label{display:block;font-size:13px;font-weight:800;color:var(--ink2)}
.nut-grid .inp{min-height:48px;padding:8px 6px;text-align:center;font-size:16px;margin-top:4px}
.sumbox{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:18px}
.calc{display:grid;gap:10px;margin-top:10px}
.calc div{display:flex;justify-content:space-between;gap:10px;font-size:16px;border-top:1px solid var(--line);padding-top:10px}
.calc div:first-child{border-top:0;padding-top:0}
.calc b{font-weight:900}
.calc span{color:var(--ink2);text-align:right}
.cmp{width:100%;border-collapse:collapse;margin-top:8px;font-size:16px}
.cmp th,.cmp td{text-align:left;padding:11px 6px;border-top:1px solid var(--line)}
.cmp th{font-size:14px;color:var(--ink2);font-weight:800;border-top:0}
.cmp td:last-child,.cmp th:last-child{text-align:right}

/* ---------- test ---------- */
.qblock{margin-top:26px}
.qblock h3{font:800 18px var(--font);margin-bottom:10px}
.stars{display:flex;gap:6px}
.stars button{width:54px;height:54px;border-radius:14px;display:grid;place-items:center;color:var(--peach)}
.stars button svg{width:36px;height:36px;stroke-width:1.8}
.stars button.on{color:var(--rasp)}
.stars button.on svg{fill:currentColor}

/* ---------- kitchen ---------- */
.kcard{background:var(--card);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}
.kcard .top{display:grid;grid-template-columns:96px 1fr;gap:14px;padding:14px;align-items:center;cursor:pointer}
.kcard .top .thumb{aspect-ratio:1;border-radius:18px}
.kcard h3{font:800 19px/1.2 var(--font);color:var(--choc)}
.kcard .meta{font-size:15px;color:var(--ink2);margin-top:4px;font-weight:700}
.kcard .last{margin:0 14px;padding:12px 14px;border-radius:16px;background:var(--butter-soft);font-size:15.5px}
.kcard .acts{padding:12px 14px 14px}

/* ---------- profile ---------- */
.statusopt{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;width:100%;text-align:left;padding:14px;border-radius:18px;border:2.5px solid var(--line);background:var(--card);margin-top:10px}
.statusopt .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:900 19px var(--font)}
.statusopt b{display:block;font-size:17px;font-weight:800}
.statusopt small{display:block;font-size:15px;color:var(--ink2);font-weight:600}
.statusopt.on{border-color:var(--rasp);background:var(--rasp-soft)}
.thr{display:grid;grid-template-columns:1fr 110px;gap:12px;align-items:center;margin-top:12px}
.thr .inp{text-align:center}
.about p+p{margin-top:10px}

/* ---------- sheet / toast ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:60;animation:fade .18s ease}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-height:90vh;overflow:auto;background:var(--bg);border-radius:30px 30px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));animation:up .24s cubic-bezier(.2,.8,.2,1);box-shadow:0 -10px 40px rgba(0,0,0,.18)}
.sheet-in{max-width:600px;margin:0 auto}
.sheet .grab{width:44px;height:5px;border-radius:5px;background:var(--line);margin:4px auto 14px}
.sheet h2{font:900 25px/1.15 var(--font)}
.sheet .btn{margin-top:14px}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:var(--choc);color:#FFF8F0;padding:14px 20px;border-radius:18px;font-weight:800;font-size:16px;max-width:calc(100% - 40px);box-shadow:0 12px 30px -10px rgba(0,0,0,.4);animation:fade .2s ease}
.keeper{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .2s ease}
.keeper .k{text-align:center;animation:rise .45s cubic-bezier(.2,1.2,.4,1)}
.keeper .ring{width:100px;height:100px;border-radius:50%;background:var(--pista);color:#1F3A18;display:grid;place-items:center;margin:0 auto 18px}
.keeper .ring svg{width:52px;height:52px;stroke-width:3}
.keeper h2{font:900 32px/1.1 var(--font)}
.keeper p{color:var(--ink2);margin-top:6px;font-size:17px}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.96)}}
.seltoggle{display:flex;background:var(--cream);border-radius:16px;padding:4px;gap:4px}
.seltoggle button{min-height:44px;min-width:46px;border-radius:12px;display:grid;place-items:center;color:var(--ink2)}
.seltoggle button.on{background:var(--card);color:var(--rasp-ink);box-shadow:var(--shadow)}
.tabs3{display:grid;grid-template-columns:repeat(3,1fr);background:var(--cream);border-radius:18px;padding:4px;gap:4px;margin-top:16px}
.tabs3 button{min-height:48px;border-radius:14px;font:800 16px var(--font);color:var(--ink2)}
.tabs3 button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.count{font-size:15px;color:var(--ink2);margin:16px 0 10px;font-weight:700}
.printpick{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);font-size:17px}
.printpick input{width:24px;height:24px;accent-color:var(--rasp)}
#print-root{display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:700px){.rgrid{grid-template-columns:repeat(3,1fr)}}
@media print{
  body{background:#fff}
  body>*:not(#print-root){display:none!important}
  #print-root{display:block;color:#000;font:11.5pt/1.5 Georgia,serif}
  .p-recipe{page-break-after:always;padding:0 4mm}
  .p-recipe:last-child{page-break-after:auto}
  .p-recipe h1{font:800 24pt/1.1 'Nunito',Helvetica,Arial,sans-serif;margin:0 0 4pt}
  .p-recipe h2{font:800 13pt Helvetica,Arial,sans-serif;margin:14pt 0 4pt;border-bottom:1px solid #ccc;padding-bottom:3pt}
  .p-recipe .p-meta{color:#444;font:10pt Helvetica,Arial,sans-serif}
  .p-recipe ul{list-style:none;padding:0;margin:0}
  .p-recipe li{margin:2pt 0}
  .p-recipe h3{font:700 11pt Helvetica,Arial,sans-serif;margin:8pt 0 2pt}
}
</style>

const ALWAYS_HAVE=new Set(['water','ice','ice cube']);
/** checkRecipeAgainstPantry(recipe, factor, overrides) — always the FINAL version being made */
function checkRecipeAgainstPantry(r,factor=1,overrides={}){
  const rows=[];
  for(const i of r.adaptedIngredients||[]){
    if(!(i.name||'').trim())continue;
    const c=canonicalIngredient(i.name);
    const row={id:i.id,name:i.name,key:c.key,display:c.display,optional:!!i.optional,line:lineOf(i),status:'need',need:null,have:null,remaining:null,overridden:false,match:null};
    const q=qtyOf(i.amount,i.unit); if(q)row.need={...q,value:q.value*factor};
    if(ALWAYS_HAVE.has(c.key)){row.status='have';row.basic=true;rows.push(row);continue}
    const m=matchRecipeIngredientToPantry(i,{reqs:r.userRequirements||[]});
    if(m){
      row.match=m;row.pantryId=m.product.id;
      if(m.level==='exact'||m.level==='compatible'||m.level==='unknown'){
        row.status='have';const pq=productQty(m.product);row.have=pq;
        if(pq&&row.need){const conv=convertQty(pq,row.need.dim,c.key);if(conv){const rem=row.need.value-conv.value;if(rem>row.need.value*0.02){row.status='partial';row.remaining={...row.need,value:rem}}}}
      }else row.status=m.level==='possible'?'possible':m.level==='unknown'?'unknown':'need';
    }
    const o=overrides[i.id];if(o){row.status=o;row.overridden=true;if(o==='have')row.remaining=null}
    rows.push(row);
  }
  const counted=rows.filter(x=>!x.optional&&!x.basic);
  return {rows,total:counted.length,have:counted.filter(x=>x.status==='have').length,missing:counted.filter(x=>x.status!=='have')};
}

  const res=recipes.filter(r=>(r.adaptedIngredients||[]).some(i=>i.name.trim())).map(r=>({r,c:checkRecipeAgainstPantry(r)}))

const PLANT_MILK=['almond milk','oat milk','soy milk','coconut milk','rice milk','cashew milk','plant milk','hemp milk'];
/** returns {status:'ok'|'violates'|'unsure', note} for one ingredient and one requirement */
function checkIngredient(name,req){

    if(/\boats?\b|oat flour|oatmeal/.test(n))return unsure('oats are often cross-contaminated unless certified gluten-free');
    if(/baking powder/.test(n))return unsure('some baking powders contain wheat starch');
    if(/soy sauce/.test(n))return bad('soy sauce usually contains wheat');

  case 'Lactose Free':
    if(lf||df||plantMilk)return ok();
    if(/peanut butter|almond butter|nut butter|seed butter|cocoa butter|apple butter/.test(n))return ok();
    if(/\b(milk|butter|cream|cheese|yogh?urt|skyr|quark|ricotta|mascarpone|whey|buttermilk|condensed|kefir)\b/.test(n)&&!/coconut/.test(n))return bad('regular dairy contains lactose');
    if(/milk chocolate|white chocolate/.test(n))return bad('contains milk');
    if(/chocolate/.test(n))return unsure('chocolate may contain milk; check the label');
    if(/ghee/.test(n))return unsure('ghee is very low in lactose but not always lactose free');
    return ok();
  case 'Dairy Free':
    if(df||plantMilk)return ok();
    if(/peanut butter|almond butter|nut butter|seed butter|cocoa butter|apple butter|coconut cream/.test(n))return ok();
    if(/\b(milk|butter|cream|cheese|yogh?urt|skyr|quark|ricotta|mascarpone|whey|casein|buttermilk|condensed|kefir|ghee)\b/.test(n)&&!/coconut/.test(n))return bad(lf?'lactose-free dairy is still dairy':'dairy ingredient');
    if(/milk chocolate|white chocolate/.test(n))return bad('contains milk');
    if(/chocolate/.test(n))return unsure('chocolate may contain milk; check the label');
    return ok();
  case 'Nut Free':
    if(/\b(almonds?|walnuts?|pecans?|hazelnuts?|cashews?|pistachios?|macadamias?|peanuts?|brazil nuts?|pine nuts?|praline|marzipan|nutella|nut butter|nuts)\b/.test(n))return bad('nut ingredient');

/** checkRequirements(ingredients, requirements, avoidList) */
function checkRequirements(list,reqs,avoid=[]){
  const out=reqs.map(req=>{
    const bad=[],uns=[];
    (list||[]).forEach(i=>{if(!(i.name||'').trim())return;const c=checkIngredient(i.name,req);if(c.status==='violates')bad.push({name:i.name,note:c.note});else if(c.status==='unsure')uns.push({name:i.name,note:c.note})});

    const detail=bad.length?bad.map(b=>`${b.name}: ${b.note}`).join('; '):uns.length?uns.map(u=>`${u.name}${u.note?': '+u.note:''}`).join('; '):'No conflicting ingredients found by name.';
    return {requirement:req,status,detail,ingredients:(bad.length?bad:uns).map(x=>x.name)};
  });
  if(avoid.length){
    const hits=(list||[]).filter(i=>avoid.some(a=>matchTerm(a,i.name))).map(i=>i.name);
    out.push({requirement:'My Avoid list',status:hits.length?'not_met':'met',detail:hits.length?'Contains ingredients you marked Avoid.':'None of your Avoid ingredients are in this recipe.',ingredients:hits});

/* ---------- ingredient functions ---------- */
function identifyIngredientFunctions(list){
  return (list||[]).map(i=>{
    const n=(i.name||'').toLowerCase(), f=[];
    if(/flour|oats?\b|starch|almond meal|ground almond|breadcrumb|biscuit|cookie|puffed rice/.test(n))f.push('structure');
    if(/oil|butter|ghee|cream\b|mascarpone|cream cheese|coconut milk|nut butter|peanut butter|almond butter|avocado|chocolate/.test(n))f.push('fat');
    if(/sugar|syrup|honey|agave|sweetener|erythritol|stevia|monk|dates?\b|banana|maple/.test(n))f.push('sweetener');
    if(/milk|water|juice|coffee|espresso(?! powder)|applesauce|puree/.test(n))f.push('liquid');
    if(/\beggs?\b|flax|chia|gelatin|gelatine|banana|xanthan|psyllium|applesauce/.test(n))f.push('binder');
    if(/baking soda|baking powder|yeast|bicarbonate/.test(n))f.push('leavening');
    if(/vanilla|cinnamon|salt|spice|cocoa|coffee|espresso|zest|extract|nutmeg|ginger|cardamom/.test(n))f.push('flavor');
    if(/collagen|protein|whey|skyr|greek yogurt|quark|cottage|egg white/.test(n))f.push('protein');
    if(/cornstarch|gelatin|gelatine|xanthan|chia|tapioca/.test(n))f.push('thickener');
    if(/berr|chips|sprinkle|frosting|glaze|topping|nuts?\b|coconut flake/.test(n))f.push('topping');
    if(/lemon|vinegar|buttermilk|yogh?urt|skyr/.test(n))f.push('acid');
    if(/egg yolk|lecithin|\beggs?\b/.test(n))f.push('emulsifier');
    return {id:i.id,name:i.name,functions:[...new Set(f)]};
  });
}


/* =====================================================================
   IMPORT PIPELINE — text normalisation
   Clipboard text sometimes arrives percent-encoded (e.g. "2%20cups%0A").
   The app never encodes text itself; this cleans it at the door so the
   textarea, the parser and storage all hold human-readable text.
   ===================================================================== */
function looksPercentEncoded(s){
  const m=String(s||'').match(/%[0-9A-Fa-f]{2}/g); if(!m)return false;
  return m.length>=2||/%(20|0A|0D|09|2C|3A|C2|C3|E2)/i.test(s);
}
/** decode percent-encoding ONCE, safely. Malformed sequences are left as they are. */
function safeDecodeRecipeText(value){
  if(!value)return '';
  let text=String(value);
  if(!looksPercentEncoded(text))return text;
  if(!/ /.test(text)&&/\+/.test(text)&&!/%20/i.test(text))text=text.replace(/\+/g,' '); // form-style encoding uses + for spaces
  try{return decodeURIComponent(text)}
  catch(error){
    console.warn('Recipe text could not be fully decoded',error);
    return text.replace(/(?:%[0-9A-Fa-f]{2})+/g,run=>{try{return decodeURIComponent(run)}catch(_){return run}});
  }
}
/** normalizeRecipeInput(raw) → readable text. Never mutates or stores over the raw input. */
function normalizeRecipeInput(raw){
  let t=safeDecodeRecipeText(raw);
  t=t.replace(/\r\n?/g,'\n').replace(/[\u00A0\u2007\u202F]/g,' ').replace(/[\u200B-\u200D\u2060\uFEFF]/g,'').replace(/\u2044/g,'/').replace(/\t/g,' ');
  const out=[],seen=new Set();
  for(let l of t.split('\n')){
    l=l.replace(/ {2,}/g,' ').trim();
    l=l.replace(/^[•·▪▫◦●○■□▢☐☑✓✔✅➤➢►▶❥\-–—*]+\s*(?=\S)/,'');          // bullets
    l=l.replace(/^(?:\p{Extended_Pictographic}|\uFE0F|\u200D)+\s*(?=[\d½¼¾⅓⅔⅛])/u,''); // emoji bullet before a quantity
    l=l.replace(/\s*(?:…|\.\.\.)\s*more$/i,'').replace(/^see translation$/i,'');        // copy artifacts
    if(!l){if(out.length&&out[out.length-1]!=='')out.push('');continue}
    const k=l.toLowerCase(); if(k.length>2&&seen.has(k))continue; // duplicate lines (e.g. overlapping screenshots)
    seen.add(k); out.push(l);
  }
  while(out.length&&out[out.length-1]==='')out.pop();
  return out.join('\n').trim();
}

  /^(view|see) (all )?[\d,.]*\s*(comments?|replies|likes)$/i,
  /^liked by .+/i, /^[\d.,]+\s*[kmb]?\s*(likes?|comments?|views?|shares?|saves?|followers?)$/i,
  /^original audio\b.*/i, /^suggested for you$/i,

/** remove social-media chrome so the parser only sees recipe content */
function cleanSocialText(text){
  return String(text||'').split('\n').map(l=>l.replace(/(?:\p{Extended_Pictographic}|\uFE0F|\u200D)+/gu,' ').replace(/(^|\s)[#@][\p{L}\w.]+/gu,' ').replace(/ {2,}/g,' ').trim())

/* ---------- texture targets ---------- */
const TEXTURE_LABEL={keep:'Keep original texture',fudgy:'Fudgy',cakey:'Cakey',chewy:'Chewy',soft:'Soft',moist:'Moist',fluffy:'Fluffy',creamy:'Creamy',crunchy:'Crunchy',dense:'Dense',light:'Light'};
function textureOptionsFor(name){
  const n=String(name||'').toLowerCase();
  if(/brownie|blondie/.test(n))return ['fudgy','cakey','chewy','moist'];
  if(/cookie|biscuit|bar\b|granola/.test(n))return ['chewy','soft','crunchy'];
  if(/cheesecake|mousse|pudding|panna|cream|custard/.test(n))return ['creamy','light','dense'];
  if(/pancake|waffle/.test(n))return ['fluffy','soft','light'];
  if(/truffle|ball|bites|fudge/.test(n))return ['fudgy','chewy','soft'];
  if(/muffin|cupcake|cake|loaf|bread/.test(n))return ['moist','fluffy','soft','light','dense'];
  return ['moist','fluffy','soft','fudgy','chewy','creamy','crunchy','light','dense'];
}
/* ---------- local collagen evaluation ---------- */
function evaluateCollagenLocal(rec){
  const names=(rec.ingredients||[]).map(i=>i.name.toLowerCase()).join(' | '), nm=(rec.name||'').toLowerCase();
  if(!rec.ingredients||!rec.ingredients.length)return {verdict:'unknown',reason:'There are no ingredients to judge yet.'};
  if(/collagen/.test(names))return {verdict:'yes',amount:'Already included',where:'As written in the recipe',reduce:'',liquid:'',texture:'',reason:'This recipe already contains collagen.'};
  if(/meringue|pavlova|macaron|souffl/.test(nm)||(/egg white/.test(names)&&/whip/.test(nm)))return {verdict:'no',reason:'Whipped egg-white desserts depend on a delicate foam; collagen can weigh it down.'};
  if(/jelly|panna cotta|mousse/.test(nm))return {verdict:'yes_adjust',amount:'10–15 g',where:'Dissolve in the warm liquid',reduce:'',liquid:'',texture:'Can make the set slightly firmer.',reason:'Dissolves into warm liquids, but may change how it sets.'};
  const batter=/muffin|cake|brownie|cookie|pancake|loaf|bread|waffle|blondie|bar/.test(nm)||/flour|oats?\b/.test(names);
  const structure=(rec.ingredients||[]).filter(i=>/flour|oats?\b|ground almond/.test(i.name.toLowerCase()));
  const dryG=structure.reduce((a,i)=>a+(gramsOf(i)||0),0);
  if(batter){
    const amt=dryG?Math.max(10,Math.min(30,Math.round(dryG*0.08/5)*5)):20;
    return {verdict:'yes_adjust',amount:`${amt} g collagen peptides`,where:'Whisk into the dry ingredients',reduce:'Keep the flour as it is — collagen does not replace flour.',liquid:'Add about 1–2 tbsp extra liquid',texture:'Collagen can make baked batters a little firmer and drier.',reason:'Works well in batters with a small liquid adjustment.',grams:amt};
  }
  if(/cheesecake|no.bake|skyr|yogurt|cream cheese|pudding|truffle|ball/.test(nm+' '+names))
    return {verdict:'yes',amount:'15–20 g collagen peptides',where:'Whisk into the creamy filling',reduce:'',liquid:'',texture:'Usually blends smoothly into creamy mixtures.',reason:'Creamy, no-bake mixtures take collagen easily.',grams:20};
  return {verdict:'unknown',reason:"Smart Treats can't tell enough about this recipe's texture to say."};
}

  const tb=cups*16; if(tb>=1)return {amount:fmtQty(roundTo(tb,.5)),unit:'tbsp'};

function feedbackAffinity(x){

/** post-processing shared by both engines: local safety-net checks + nutrition + goal feedback */
function finishAdaptation(orig,a,needs,profile){
  a.servings=a.servings||orig.servings||null;
  // pantry: use what I already have (never against a must-have)
  a.pantrySuggestions=[];
  if(typeof DB!=='undefined'&&activeProducts().length){
    for(const ing of a.ingredients){
      const direct=matchRecipeIngredientToPantry(ing,{reqs:needs.reqs});
      if(direct&&(direct.level==='exact'||direct.level==='compatible'))continue;
      const m=direct&&direct.level==='possible'?direct:null; if(!m)continue;
      if(needs.usePantry){
        const before=lineOf(ing),old=ing.name;ing.name=pantryIngredientName(m.product);ing.pantryId=m.product.id;
        const why=`You already have this ${locWord(m.product)}${needs.reqs.length?` and it fits your ${needs.reqs.join(', ')} requirement${needs.reqs.length>1?'s':''}`:''}. ${m.note}`;
        const prev=a.changes.find(c=>c.replacement&&c.replacement.includes(before));
        if(prev){prev.replacement=prev.replacement.replace(before,lineOf(ing));prev.why=(prev.why?prev.why+' ':'')+why;prev.fromPantry=true}
        else a.changes.push({id:uid(),ingredient:cap(old),original:before,replacement:lineOf(ing),why,confidence:'medium',related:'',fromPantry:true});
      }else a.pantrySuggestions.push({ingredient:ing.name,product:m.product.productName,location:locLabel(m.product),note:m.note});
    }
  }
  const local=checkRequirements(a.ingredients,needs.reqs,profile.avoid||[]);
  // the local check is a safety net: a local "not met" always wins over an AI "met"
  a.requirementChecks=local.map(l=>{const ai=(a.aiChecks||[]).find(c=>c.requirement.toLowerCase()===l.requirement.toLowerCase());
    if(l.status==='not_met')return l; if(ai&&ai.status!=='met')return {...ai,requirement:l.requirement}; if(l.status==='cannot_confirm')return l; return ai?{...ai,requirement:l.requirement}:l});
  a.functions=a.functions&&a.functions.length?a.functions:identifyIngredientFunctions(a.ingredients).map(f=>({name:f.name,functions:f.functions}));
  a.origNutrition=calculateNutrition(orig.ingredients,orig.servings);
  a.nutrition=calculateNutrition(a.ingredients,a.servings);
  a.portion=null;
  if(a.origNutrition.complete&&a.nutrition.complete&&num(a.servings)&&num(orig.servings)&&num(a.servings)!==num(orig.servings)){
    const atOrig=a.nutrition.total.kcal/num(orig.servings);
    a.portion={ingredientEffect:a.origNutrition.per.kcal-atOrig,portionEffect:atOrig-a.nutrition.per.kcal,from:num(orig.servings),to:num(a.servings)};
  }
  a.goalFeedback=goalFeedback(orig,a,needs);
  const tags=[];a.requirementChecks.forEach(c=>{if(c.status==='met'&&BODY_REQS.concat(needs.reqs).includes(c.requirement))tags.push(c.requirement)});
  a.goalFeedback.forEach(g=>{if(g.status==='met')tags.push(g.goal)});
  if(a.freezer===true)tags.push('Freezer Friendly');
  a.tags=[...new Set(tags)];
  return a;
}
function goalFeedback(orig,a,needs){
  const cmp=compareNutrition(a.origNutrition,a.nutrition), out=[];
  const pct=(k)=>cmp&&cmp[k].pct!=null?Math.abs(Math.round(cmp[k].pct)):null;
  const g1=v=>Math.abs(Math.round(v*10)/10);
  for(const g of needs.goals){
    let status='unknown',text='Nutrition estimate incomplete, so this can’t be calculated.';
    const need=k=>{if(!cmp)return false;return true};
    switch(g){
      case 'Lower Calories': if(need()){const d=cmp.kcal.diff;status=d<0?'met':'not_met';text=d<0?`Estimated ${pct('kcal')}% reduction (${Math.round(cmp.kcal.orig)} → ${Math.round(cmp.kcal.mine)} kcal per serving)`+(a.portion?` — about ${Math.round(a.portion.ingredientEffect)} kcal from ingredient changes and ${Math.round(a.portion.portionEffect)} kcal from smaller portions`:''):`No reduction found (${Math.round(cmp.kcal.orig)} → ${Math.round(cmp.kcal.mine)} kcal)`}break;
      case 'Lower Calorie Per Portion': if(need()){const d=cmp.kcal.diff;status=d<0?'met':'not_met';text=d<0?`Estimated ${Math.abs(Math.round(d))} kcal less per serving`:'No reduction per serving found'}break;
      case 'Lower Fat': if(need()){const d=cmp.fat.diff;status=d<0?'met':'not_met';text=d<0?`Estimated ${g1(d)} g less fat per serving (${pct('fat')}%)`:'No fat reduction found'}break;
      case 'Lower Carbs': if(need()){const d=cmp.carbs.diff;status=d<0?'met':'not_met';text=d<0?`Estimated ${g1(d)} g fewer carbs per serving`:'No carb reduction found'}break;
      case 'Lower Sugar': if(need()){const d=cmp.sugar.diff;status=d<0?'met':'not_met';text=d<0?`Estimated ${g1(d)} g less sugar per serving`:'No sugar reduction found'}break;
      case 'Higher Protein': if(need()){const d=cmp.protein.diff;status=d>0?'met':'not_met';text=d>0?`Estimated +${g1(d)} g protein per serving`:'No protein increase found'}break;
      case 'Higher Fiber': if(need()){const d=cmp.fiber.diff;status=d>0?'met':'not_met';text=d>0?`Estimated +${g1(d)} g fiber per serving`:'No fiber increase found'}break;
      case 'More Filling': if(need()){const dp=cmp.protein.diff,df=cmp.fiber.diff;status=dp+df>0?'met':'not_met';text=`Protein ${dp>=0?'+':''}${g1(dp)===0?0:(dp<0?'-':'')+g1(dp)} g, fiber ${df>=0?'+':'-'}${g1(df)} g per serving`.replace('+-','-')}break;
      case 'Higher Volume':{const ch=(a.changes||[]).some(c=>/volume|zucchini|portion/i.test(c.ingredient+c.why));status=ch?'met':'unknown';text=ch?'Volume added — see the changes below':'No volume change made';break}
      case 'Collagen Friendly':{const v=a.collagen&&a.collagen.verdict;const inR=(a.ingredients||[]).some(i=>/collagen/i.test(i.name));status=inR?'met':v==='no'?'not_met':'unknown';text=inR?'Collagen added to the recipe':v==='no'?'Collagen not recommended for this recipe':'Collagen not added';break}
    }
    out.push({goal:g,status,text});
  }
  if(needs.strength==='keep_close'||needs.keepClose){const n=(a.changes||[]).length;out.push({goal:'Close to the original',status:'met',text:`${n} ${n===1?'change':'changes'} made`})}
  return out;
}

/* ============ shared recipe bits ============ */
function groupIngs(list){const g=[];list.forEach(i=>{const k=(i.group||'').trim();let x=g.find(y=>y.k===k);if(!x){x={k,items:[]};g.push(x)}x.items.push(i)});return g}
function checksFor(id){return ui.checks[id]||(ui.checks[id]={ing:new Set(),step:new Set()})}
function tolSection(r){
  const cs=tolChecks(r);
  if(!cs.length)return `<p class="sub">Add ingredients to see how they line up with My Ingredients.</p>`;
  const av=cs.filter(c=>c.status==='avoid').length, ca=cs.filter(c=>c.status==='caution').length, un=cs.filter(c=>c.status==='unknown').length;
  let b='';
  if(av)b+=`<div class="banner tol-avoid">This recipe contains an ingredient you've marked Avoid.</div>`;
  if(ca)b+=`<div class="banner tol-caution">You've marked ${ca===1?'one ingredient':ca+' ingredients'} Caution.</div>`;
  if(un)b+=`<div class="banner tol-unknown">${un===1?'One ingredient has':un+' ingredients have'} no tolerance recorded yet. Tap to record.</div>`;
  const msg={avoid:"You've marked this ingredient Avoid.",caution:"You've marked this ingredient Caution.",unknown:"You haven't recorded your tolerance for this ingredient yet.",good:''};
  return b+cs.map(c=>`<button class="tolrow" data-act="tol-edit" ${c.tol?`data-tid="${c.tol.id}"`:`data-name="${esc(c.name)}"`}><span><b>${esc(c.name)}</b><small>${c.tol&&c.tol.notes?esc(c.tol.notes):msg[c.status]}</small></span><span class="pill tol-${c.status}">${TOL[c.status].ic} ${TOL[c.status].label}</span></button>`).join('');
}
function nutTable(cols){
  return `<table class="ntable"><thead><tr><th></th>${cols.map(c=>`<th>${c.label}</th>`).join('')}</tr></thead><tbody>${NUT.map(k=>`<tr><td>${NUTL[k]}</td>${cols.map((c,ix)=>`<td>${c.per?(ix===cols.length-1?'<b>':'')+fmtN(c.per[k],k)+(k==='kcal'?'':' g')+(ix===cols.length-1?'</b>':''):'—'}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}
function missingNote(c){
  if(!c)return '';
  let h='';
  if(c.missing.length)h+=`<p class="note y"><b>Nutrition estimate incomplete.</b> Nutrition information needed for: ${esc(c.missing.join(', '))}. Add values from the product label in “Edit it myself → Nutrition”.</p>`;
  if(c.uncounted.length)h+=`<p class="sub" style="margin-top:10px">Not counted (no amount given): ${esc(c.uncounted.join(', '))}.</p>`;
  return h;
}
function nutritionDetails(r){
  const c=nut(r),s=servingsOf(r),unit=servingUnitOf(r);
  if(c.whole&&c.any)return `<p class="sub">Nutrition calculated for whole recipe — add the serving count to see it per ${esc(unit)}.</p><div class="calc">${NUT.map(k=>`<div><b>${NUTL[k]}</b><span><b>${fmtN(c.total[k],k)} ${unitOf(k)}</b></span></div>`).join('')}</div>${missingNote(c)}`;
  if(!c.any)return `<p class="sub">Nutrition information needed.</p>${missingNote(c)}<button class="btn btn-soft" style="margin-top:12px" data-act="edit" data-id="${r.id}" data-step="4">Add nutrition</button>`;
  let h=`<p class="sub">${nLabel(r)} — ${c.sources.includes('reference')?'calculated from typical values for each ingredient':'from the values you entered'}. Never exact.</p><div class="calc">`;
  NUT.forEach(k=>{h+=`<div><b>${NUTL[k]}</b><span>${fmtN(c.total[k],k)} ${unitOf(k)} ÷ ${s} = <b>${fmtN(c.per[k],k)} ${unitOf(k)}</b> per ${esc(unit)}</span></div>`});
  h+='</div>'+missingNote(c);
  const op=origPer(r);
  if(op&&c.complete)h+=`<h3 style="margin-top:20px">Original vs my version</h3><p class="sub">Per serving.</p>${nutTable([{label:'Original',per:op},{label:'Mine',per:c.per}])}`;
  return h;
}
function cmpTable(r){const op=origPer(r);return op?nutTable([{label:'Original',per:op},{label:'My version',per:ps(r)}]):''}
function testsHTML(r){

function fold(title,body,extra='',open=false){return `<details class="fold"${open?' open':''}><summary>${title}${extra!==''&&extra!=null?`<small>${extra}</small>`:''}${I.chev}</summary><div class="fold-body">${body}</div></details>`}

function foundChecks(F){
  const ings=F.ingredients.filter(i=>(i.name||'').trim()), steps=F.instructions.filter(x=>(x||'').trim());

  const low=k=>F.confidence&&F.confidence[k]==='low';
  const c=[];
  c.push(ings.length?{s:low('ingredients')?'cannot_confirm':'met',t:`${ings.length} ingredients found`,d:low('ingredients')?"I cannot confirm I read all of them — some text may be cut off.":''}:{s:'not_met',t:'No ingredients found',d:'Add another screenshot or paste the ingredient list.',more:1});
  if(ings.length)c.push(noAmt.length?{s:'cannot_confirm',t:`${ings.length-noAmt.length} of ${ings.length} have quantities`,d:`No amount for: ${noAmt.map(i=>i.name).join(', ')}. Add them in Edit something if you know them.`}:{s:'met',t:'Quantities found'});
  c.push(steps.length?{s:low('instructions')?'cannot_confirm':'met',t:'Method found',d:low('instructions')?'I cannot confirm every step was readable.':''}:{s:'cannot_confirm',t:'Method not found',d:(W.mode==='photos'?'Add another screenshot if you have the instructions.':'Paste the instructions too if you have them.')+' I can still adapt the ingredients without it.',more:1});

  if(low('title'))c.push({s:'cannot_confirm',t:'Recipe name',d:'I cannot confirm this — check the name.'});
  return {c,ready:ings.length>0&&!!num(F.servings),issues:c.filter(x=>x.s!=='met').length};
}

function rebuildPriorities(){
  const N=W.needs, keep=N.priorities.filter(p=>(p.kind==='req'&&N.reqs.includes(p.key))||(p.kind==='goal'&&N.goals.includes(p.key)));
  const reqs=N.reqs.map(k=>keep.find(p=>p.kind==='req'&&p.key===k)||{key:k,kind:'req',level:'must'});
  reqs.forEach(p=>p.level='must');
  let goals=keep.filter(p=>p.kind==='goal');
  N.goals.forEach(k=>{if(!goals.some(p=>p.key===k))goals.push({key:k,kind:'goal',level:goals.length?'preferred':'high'})});
  if(goals.length&&!goals.some(g=>g.level==='high'))goals[0].level='high';
  N.priorities=[...reqs,...goals];
}

  <h1 class="wtitle">Let's make it yours</h1>
  <p class="sub" style="font-size:17.5px">What matters for <b>${esc(W.found.name||'this recipe')}</b>?</p>

    <div class="chips" style="margin-top:12px">${bodyOpts.map(q=>`<button class="chip req ${N.reqs.includes(q)?'on':''}" data-act="wiz-req" data-v="${esc(q)}" aria-pressed="${N.reqs.includes(q)}">${N.reqs.includes(q)?I.check:''}${esc(q)}</button>`).join('')}<button class="chip add" data-act="req-custom" data-scope="wizard">+ Add my own sensitivity</button></div>
